
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's the Weather Today?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-color: #E0F7FA;
    --text-dark: #263238;
    --c-sun: #FFCA28;
    --c-rain: #29B6F6;
    --c-cloud: #90A4AE;
    --c-wind: #4DB6AC;
    --c-storm: #37474F;
    --c-fog: #B0BEC5;
    --c-snow: #81D4FA;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-color);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========== PROGRESS BAR ========== */
  .progress-bar {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 8px;
    background: rgba(0,0,0,0.05);
    z-index: 1000;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: #FF7043;
    transition: width 0.1s linear;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    background: white;
    padding: 15px 40px;
    border-radius: 50px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    border: 4px solid white;
    transition: border-color 0.5s;
  }
  .title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 5vw, 48px);
    color: #FF7043;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1200px;
    margin-bottom: 30px;
  }

  .weather-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    border: 4px solid transparent;
    transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    opacity: 0.6;
    transform: scale(0.95);
  }

  .weather-card.active {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    z-index: 10;
  }

  .weather-window {
    height: 150px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .weather-title {
    position: absolute;
    bottom: 10px; left: 15px;
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 5;
  }

  /* WEATHER SCENES */
  .scene-sun { background: linear-gradient(to bottom, #4FC3F7, #B3E5FC); }
  .scene-rain { background: linear-gradient(to bottom, #78909C, #B0BEC5); }
  .scene-storm { background: linear-gradient(to bottom, #263238, #546E7A); }
  .scene-snow { background: linear-gradient(to bottom, #B3E5FC, #E1F5FE); }
  .scene-wind { background: linear-gradient(to bottom, #80CBC4, #E0F2F1); }

  .drop { position: absolute; width: 2px; height: 10px; background: white; animation: fall linear infinite; }
  .flake { position: absolute; color: white; animation: fall linear infinite; }
  .lightning { position: absolute; inset: 0; background: white; opacity: 0; animation: flash 5s infinite; }

  @keyframes fall { to { transform: translateY(160px); } }
  @keyframes flash { 0%, 92%, 96%, 100% { opacity: 0; } 94% { opacity: 0.6; } }

  .card-content { padding: 15px; font-size: 14px; font-weight: 700; }
  .feels-badge { display: inline-block; padding: 4px 10px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }

  .controls { position: fixed; bottom: 20px; display: flex; gap: 10px; background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; }
  .btn { border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; }
  .btn-play { background: #FF7043; color: white; }
  
  /* Speaker status */
  .speaker-icon { font-size: 24px; margin-right: 10px; }
  .speaking { animation: pulse 1s infinite; color: #FF7043; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="timerBar"></div></div>

<header>
  <h1 class="title">What's the Weather?</h1>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 5px;">
    <span id="speaker" class="speaker-icon">🔈</span>
    <p id="status-text" style="font-weight: 800; color: #666;">Loading weather sounds...</p>
  </div>
</header>

<div class="grid" id="posterGrid">
  <div class="weather-card" id="card-0">
    <div class="weather-window scene-sun"><div class="weather-title">Sunny</div>☀️</div>
    <div class="card-content">
      <div class="feels-badge" style="background:#FFF9C4; color:#F57F17;">Warm and Bright</div>
      <p>Wear a hat and sunglasses!</p>
    </div>
  </div>
  <div class="weather-card" id="card-1">
    <div class="weather-window scene-rain" id="rain-box"><div class="weather-title">Rainy</div>🌧️</div>
    <div class="card-content">
      <div class="feels-badge" style="background:#E1F5FE; color:#0277BD;">Wet and Cool</div>
      <p>Don't forget your umbrella!</p>
    </div>
  </div>
  <div class="weather-card" id="card-2">
    <div class="weather-window scene-wind" id="wind-box"><div class="weather-title">Windy</div>💨</div>
    <div class="card-content">
      <div class="feels-badge" style="background:#E0F2F1; color:#00695C;">Breezy</div>
      <p>A great day to fly a kite!</p>
    </div>
  </div>
  <div class="weather-card" id="card-3">
    <div class="weather-window scene-storm" id="storm-box"><div class="weather-title">Stormy</div>⛈️<div class="lightning"></div></div>
    <div class="card-content">
      <div class="feels-badge" style="background:#ECEFF1; color:#37474F;">Loud and Wet</div>
      <p>Stay safe inside today.</p>
    </div>
  </div>
  <div class="weather-card" id="card-4">
    <div class="weather-window scene-snow" id="snow-box"><div class="weather-title">Snowy</div>❄️</div>
    <div class="card-content">
      <div class="feels-badge" style="background:#E1F5FE; color:#0288D1;">Cold and White</div>
      <p>Time to build a snowman!</p>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-play" id="playBtn" onclick="toggleAuto()">Pause Tour</button>
  <button class="btn" onclick="speakCurrent()">Replay Sound</button>
</div>

<script>
  const apiKey = "";
  const weatherData = [
    { name: "Sunny", text: "Look! It is a Sunny day. The sun is warm and bright. Don't forget your hat!" },
    { name: "Rainy", text: "Listen! It is a Rainy day. Pitter patter, pitter patter. Grab your umbrella!" },
    { name: "Windy", text: "Whoosh! It is a Windy day. Can you hear the air moving? Let's go fly a kite!" },
    { name: "Stormy", text: "Boom! It is a Stormy day. That lightning is bright and the thunder is loud! Let's stay safe inside." },
    { name: "Snowy", text: "Brrr! It is a Snowy day. Everything is cold and white. Let's build a snowman!" }
  ];

  let currentStep = 0;
  let isAuto = true;
  let progress = 0;
  const stepDuration = 8000; // 8 seconds per card to allow for speech

  async function generateSpeech(text) {
    const speaker = document.getElementById('speaker');
    const status = document.getElementById('status-text');
    
    speaker.classList.add('speaking');
    status.innerText = "Speaking...";

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Say excitedly: ${text}` }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
          }
        })
      });

      const data = await response.json();
      const base64Audio = data.candidates[0].content.parts[0].inlineData.data;
      
      // Convert PCM to WAV (simplification for browser playback)
      const audioBlob = pcmToWav(base64Audio, 24000);
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);
      
      audio.onended = () => {
        speaker.classList.remove('speaking');
        status.innerText = "Listening...";
      };
      
      await audio.play();
    } catch (e) {
      console.error(e);
      speaker.classList.remove('speaking');
      status.innerText = "Ready";
    }
  }

  function pcmToWav(base64Pcm, sampleRate) {
    const pcmData = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0));
    const header = new ArrayBuffer(44);
    const view = new DataView(header);
    const writeString = (offset, string) => {
      for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    };
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + pcmData.length, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, pcmData.length, true);
    return new Blob([header, pcmData], { type: 'audio/wav' });
  }

  function updateDisplay() {
    document.querySelectorAll('.weather-card').forEach((c, idx) => {
      c.classList.toggle('active', idx === currentStep);
    });
    
    const activeCard = document.getElementById(`card-${currentStep}`);
    activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    progress = 0;
    generateSpeech(weatherData[currentStep].text);
  }

  function nextStep() {
    currentStep = (currentStep + 1) % weatherData.length;
    updateDisplay();
  }

  function toggleAuto() {
    isAuto = !isAuto;
    document.getElementById('playBtn').textContent = isAuto ? "Pause Tour" : "Resume Tour";
  }

  function speakCurrent() { generateSpeech(weatherData[currentStep].text); }

  setInterval(() => {
    if (isAuto) {
      progress += (100 / (stepDuration / 100));
      if (progress >= 100) nextStep();
      document.getElementById('timerBar').style.width = progress + '%';
    }
  }, 100);

  // Particles
  function addParticles(id, char, count) {
    const box = document.getElementById(id);
    for(let i=0; i<count; i++) {
      const p = document.createElement('div');
      p.className = char === '💧' ? 'drop' : 'flake';
      p.innerText = char === '💧' ? '' : char;
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (0.5 + Math.random() * 2) + 's';
      p.style.animationDelay = Math.random() * 2 + 's';
      box.appendChild(p);
    }
  }

  window.onload = () => {
    addParticles('rain-box', '💧', 20);
    addParticles('storm-box', '💧', 20);
    addParticles('snow-box', '❄️', 20);
    updateDisplay();
  };
</script>

</body>
</html>
