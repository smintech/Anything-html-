<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LENA — Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Outfit',sans-serif;width:100vw;height:100vh}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.ov{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ph{position:absolute;transition:opacity 0.9s ease}
.ph.hide{opacity:0}
.it{display:flex;flex-direction:column;align-items:center;gap:5px}
.it-topic{font-size:clamp(12px,2vw,18px);font-weight:300;color:rgba(132,204,22,0.4);letter-spacing:0.5em;text-transform:uppercase}
.it-t{font-size:clamp(56px,14vw,160px);font-weight:800;color:#84CC16;text-shadow:0 0 50px rgba(132,204,22,0.65),0 0 100px rgba(132,204,22,0.35),0 0 180px rgba(132,204,22,0.12);letter-spacing:0.05em;line-height:0.9}
.it-v{font-size:clamp(9px,1.3vw,13px);font-weight:400;color:rgba(255,255,255,0.25);letter-spacing:0.15em;margin-top:6px}
.sc{width:min(90%,580px)}
.cd{display:flex;align-items:center;gap:14px;padding:18px 20px 18px 24px;border-radius:14px;background:rgba(0,0,0,0.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0}
.ic{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx{font-size:clamp(13px,2.2vw,17px);font-weight:400;color:rgba(255,255,255,0.9);line-height:1.55;padding-left:2px}
.stamp{position:fixed;bottom:20px;right:20px;z-index:6;pointer-events:none;user-select:none}
.stamp-pill{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 16px;border-radius:100px;background:rgba(132,204,22,0.08);border:1px solid rgba(132,204,22,0.35);box-shadow:0 0 20px rgba(132,204,22,0.15),0 0 50px rgba(132,204,22,0.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stamp-dot{width:6px;height:6px;border-radius:50%;background:#84CC16;box-shadow:0 0 8px rgba(132,204,22,0.6)}
.stamp-txt{font-size:clamp(10px,1.5vw,14px);font-weight:600;color:rgba(132,204,22,0.7);letter-spacing:0.12em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov">
  <div id="iPh" class="ph it">
    <div class="it-topic">PATTERN</div>
    <div class="it-t">LENA</div>
    <div class="it-v" id="vol"></div>
  </div>
  <div id="sPh" class="ph sc hide"></div>
</div>
<div class="stamp">
  <div class="stamp-pill">
    <div class="stamp-dot"></div>
    <div class="stamp-txt">YOU DO THIS TOO</div>
  </div>
</div>
<script>
const CONFIG={title:"LENA",vol:"PATTERN PART 4",introDur:4000,subDur:5000,transDur:1800};
const SUBTEXTS=[
  {icon:"⚡",text:"She changed one thing. And it felt like something was wrong.",color:"#84CC16"},
  {icon:"🤚",text:"Hand reached for the nightstand three times. Not habit. Reflex.",color:"#F59E0B"},
  {icon:"🧠",text:"Her brain didn't say good job. It said something's wrong.",color:"#14B8A6"},
  {icon:"🔇",text:"Changing a pattern doesn't feel like progress. It feels like an error.",color:"#A855F7"}
];
document.getElementById('vol').textContent=CONFIG.vol;
const iPh=document.getElementById('iPh'),sPh=document.getElementById('sPh'),half=CONFIG.transDur/2;
function card(s){const d=document.createElement('div');d.className='cd';d.style.border='1px solid '+s.color+'30';d.style.boxShadow='0 0 30px '+s.color+'25, 0 0 70px '+s.color+'0c';d.innerHTML='<div class="bar" style="background:'+s.color+'"></div><div class="ic" style="background:'+s.color+'18;color:'+s.color+'">'+s.icon+'</div><div class="tx">'+s.text+'</div>';return d;}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
(async function run(){while(true){iPh.classList.remove('hide');sPh.classList.add('hide');await wait(CONFIG.introDur);iPh.classList.add('hide');await wait(half);for(let i=0;i<SUBTEXTS.length;i++){sPh.innerHTML='';sPh.appendChild(card(SUBTEXTS[i]));sPh.classList.remove('hide');await wait(CONFIG.subDur);if(i<SUBTEXTS.length-1){sPh.classList.add('hide');await wait(half);}}sPh.classList.add('hide');await wait(half);}})();

const c=document.getElementById('c'),ctx=c.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const CR=132,CG=204,CB=22,ER=255,EG=60,EB=60;
let W,H,cx,cy,bR,phoneX,phoneY,handX,handY,phoneW,phoneH;
const N=160;let pts=[],t0=0,lastPhase='',flashA=0;
function sz(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;bR=Math.min(W,H)*0.34;
  phoneW=Math.min(44,bR*0.3);phoneH=phoneW*2.1;
  phoneX=cx+bR*0.42;phoneY=cy;handX=cx-bR*0.65;handY=cy;
  pts=[];for(let i=0;i<N;i++)pts.push({x:cx+(Math.random()-0.5)*W,y:cy+(Math.random()-0.5)*H,tx:0,ty:0,vx:0,vy:0,edge:false,tip:false,sz:1.5+Math.random()*3,bright:0.4+Math.random()*0.6,trail:[]});
  t0=performance.now();lastPhase='';
}
function setPhone(){let i=0;for(;i<90&&i<N;i++){pts[i].tx=phoneX+(Math.random()-0.5)*phoneW*0.82;pts[i].ty=phoneY+(Math.random()-0.5)*phoneH*0.82;pts[i].edge=false;pts[i].tip=false;pts[i].vx=0;pts[i].vy=0;}for(;i<148&&i<N;i++){const s=Math.floor(Math.random()*4);let x,y;if(s===0){x=phoneX-phoneW/2;y=phoneY+(Math.random()-0.5)*phoneH;}else if(s===1){x=phoneX+phoneW/2;y=phoneY+(Math.random()-0.5)*phoneH;}else if(s===2){x=phoneX+(Math.random()-0.5)*phoneW;y=phoneY-phoneH/2;}else{x=phoneX+(Math.random()-0.5)*phoneW;y=phoneY+phoneH/2;}pts[i].tx=x;pts[i].ty=y;pts[i].edge=true;pts[i].tip=false;pts[i].vx=0;pts[i].vy=0;}for(;i<N;i++){const a=Math.random()*Math.PI*2;pts[i].tx=phoneX+Math.cos(a)*3;pts[i].ty=phoneY-phoneH/2+8+Math.sin(a)*3;pts[i].edge=true;pts[i].tip=false;pts[i].vx=0;pts[i].vy=0;}}
function explodePhone(){for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,spd=4+Math.random()*14;pts[i].vx=Math.cos(a)*spd;pts[i].vy=Math.sin(a)*spd;pts[i].tx=pts[i].x+pts[i].vx*40;pts[i].ty=pts[i].y+pts[i].vy*40;pts[i].edge=false;pts[i].tip=false;}flashA=0.35;}
function setScatter(){for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,d=bR*0.9+Math.random()*bR*1.4;pts[i].tx=cx+Math.cos(a)*d;pts[i].ty=cy+Math.sin(a)*d;pts[i].vx=0;pts[i].vy=0;pts[i].edge=false;pts[i].tip=false;}}
function setRest(){for(let i=0;i<N;i++){pts[i].tx=handX+(Math.random()-0.5)*28;pts[i].ty=handY+(Math.random()-0.5)*38;pts[i].vx=0;pts[i].vy=0;pts[i].edge=false;pts[i].tip=false;}}
function setReach(stretch){const ext=stretch||1;for(let i=0;i<N;i++){const t=Math.random(),baseX=handX+(phoneX-handX+20*ext)*t,spread=6+t*28;pts[i].tx=baseX;pts[i].ty=handY+(Math.random()-0.5)*spread;pts[i].vx=0;pts[i].vy=0;pts[i].edge=t>0.82;pts[i].tip=t>0.6;}}
const CY=24;const PH=[['phone_form',0,1.2],['phone_hold',1.2,2.8],['phone_break',2.8,3.2],['scatter',3.2,5],['regroup',5,6],['reach1',6,7.2],['grasp1',7.2,8.2],['pull1',8.2,9.5],['reach2',9.5,10.8],['grasp2',10.8,11.8],['pull2',11.8,13.2],['reach3',13.2,15.2],['grasp3',15.2,16.8],['pull3',16.8,18.8],['still',18.8,24]];
function getPhase(t){const ct=t%CY;for(const[n,s,e]of PH)if(ct>=s&&ct<e)return{name:n,p:(ct-s)/(e-s)};return{name:'still',p:1};}
function applyPhase(name){if(name===lastPhase)return;lastPhase=name;if(name==='phone_form'||name==='phone_hold')setPhone();else if(name==='phone_break')explodePhone();else if(name==='scatter')setScatter();else if(name==='regroup'||name.startsWith('pull'))setRest();else if(name==='reach1')setReach(1);else if(name==='reach2')setReach(1.15);else if(name==='reach3')setReach(1.35);}
function frame(now){
  const el=(now-t0)/1000;const{name,p}=getPhase(el);applyPhase(name);
  if(!RM){flashA*=0.92;for(let i=0;i<N;i++){const pt=pts[i];const isE=name==='phone_break'||name==='scatter';let spd;if(isE&&pt.vx!==0){pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.94;pt.vy*=0.94;}else{if(name==='reach3')spd=0.045;else if(name.startsWith('reach'))spd=0.07;else if(name.startsWith('grasp'))spd=0.12;else if(name.startsWith('pull'))spd=0.06;else if(name==='regroup')spd=0.05;else if(name==='phone_form')spd=0.1;else spd=0.04;pt.x+=(pt.tx-pt.x)*spd;pt.y+=(pt.ty-pt.y)*spd;}pt.trail.push({x:pt.x,y:pt.y});const mx=name.startsWith('reach')||name.startsWith('grasp')?12:isE?18:6;while(pt.trail.length>mx)pt.trail.shift();if(name==='still')pt.y+=0.25;}}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(flashA>0.01){ctx.fillStyle='rgba('+ER+','+EG+','+EB+','+flashA+')';ctx.fillRect(0,0,W,H);}
  if(name==='phone_form'||name==='phone_hold'){const base=name==='phone_form'?p:1,pulse=0.7+Math.sin(el*4)*0.3,ga=base*0.18*pulse;const g=ctx.createRadialGradient(phoneX,phoneY,0,phoneX,phoneY,phoneH);g.addColorStop(0,'rgba('+CR+','+CG+','+CB+','+ga+')');g.addColorStop(0.5,'rgba('+CR+','+CG+','+CB+','+(ga*0.3)+')');g.addColorStop(1,'rgba('+CR+','+CG+','+CB+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  const ct=el%CY;if(ct>4.5){let ga;if(ct<9)ga=0.2+Math.sin(el*6)*0.08;else if(ct<18)ga=Math.max(0,0.12-(ct-9)*0.012);else ga=0;if(ga>0.005){ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+ga+')';ctx.lineWidth=1.5;const r=7;ctx.beginPath();ctx.moveTo(phoneX-phoneW/2+r,phoneY-phoneH/2);ctx.lineTo(phoneX+phoneW/2-r,phoneY-phoneH/2);ctx.arcTo(phoneX+phoneW/2,phoneY-phoneH/2,phoneX+phoneW/2,phoneY-phoneH/2+r,r);ctx.lineTo(phoneX+phoneW/2,phoneY+phoneH/2-r);ctx.arcTo(phoneX+phoneW/2,phoneY+phoneH/2,phoneX+phoneW/2-r,phoneY+phoneH/2,r);ctx.lineTo(phoneX-phoneW/2+r,phoneY+phoneH/2);ctx.arcTo(phoneX-phoneW/2,phoneY+phoneH/2,phoneX-phoneW/2,phoneY+phoneH/2-r,r);ctx.lineTo(phoneX-phoneW/2,phoneY-phoneH/2+r);ctx.arcTo(phoneX-phoneW/2,phoneY-phoneH/2,phoneX-phoneW/2+r,phoneY-phoneH/2,r);ctx.closePath();ctx.stroke();}}
  for(let i=0;i<N;i++){const pt=pts[i];if(pt.trail.length<2)continue;for(let j=1;j<pt.trail.length;j++){const f=j/pt.trail.length,a=f*0.25*pt.bright;ctx.beginPath();ctx.moveTo(pt.trail[j-1].x,pt.trail[j-1].y);ctx.lineTo(pt.trail[j].x,pt.trail[j].y);ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+a+')';ctx.lineWidth=pt.sz*f*1.5;ctx.lineCap='round';ctx.stroke();}}
  for(let i=0;i<N;i++){const pt=pts[i];let dx=pt.x,dy=pt.y;if(name.startsWith('grasp')&&pt.tip){const curl=(Math.sin(el*12)+1)/2;dx-=curl*18;dy+=(handY-dy)*curl*0.45;}const a=pt.edge?1:pt.bright;const s=pt.edge?pt.sz*0.7:pt.sz;ctx.beginPath();ctx.arc(dx,dy,s*4.5,0,Math.PI*2);ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.04)+')';ctx.fill();ctx.beginPath();ctx.arc(dx,dy,s*2,0,Math.PI*2);ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.15)+')';ctx.fill();ctx.beginPath();ctx.arc(dx,dy,s,0,Math.PI*2);ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.7)+')';ctx.fill();ctx.beginPath();ctx.arc(dx,dy,s*0.35,0,Math.PI*2);ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+a+')';ctx.fill();}
  if(name==='still'){const da=Math.min(0.3,p*0.3);ctx.fillStyle='rgba(0,0,0,'+da+')';ctx.fillRect(0,0,W,H);}
  if(!RM)requestAnimationFrame(frame);
}
sz();requestAnimationFrame(frame);window.addEventListener('resize',sz);
</script>
</body>
</html>
