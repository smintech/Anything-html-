<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wait-For-It — Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  .title-block {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  .theme-label {
    font-weight: 700;
    font-size: clamp(10px, 2.5vw, 16px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(14,165,233,0.7);
    margin-bottom: 10px;
    animation: labelBreathe 5s ease-in-out infinite;
  }

  @keyframes labelBreathe {
    0%, 100% { color: rgba(14,165,233,0.6); }
    50% { color: rgba(14,165,233,0.9); }
  }

  .the-word {
    font-weight: 800;
    font-size: clamp(14px, 3.5vw, 24px);
    letter-spacing: 14px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 2px;
  }

  .char-name {
    font-weight: 900;
    font-size: clamp(40px, 11vw, 140px);
    line-height: 1.1;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0ea5e9;
    text-shadow:
      0 0 25px rgba(14,165,233,0.8),
      0 0 60px rgba(14,165,233,0.5),
      0 0 120px rgba(14,165,233,0.25);
    position: relative;
    animation: nameBreathe 4s ease-in-out infinite;
  }

  @keyframes nameBreathe {
    0%, 100% {
      text-shadow: 0 0 25px rgba(14,165,233,0.7), 0 0 60px rgba(14,165,233,0.4), 0 0 120px rgba(14,165,233,0.15);
    }
    50% {
      text-shadow: 0 0 35px rgba(14,165,233,1), 0 0 80px rgba(14,165,233,0.6), 0 0 160px rgba(14,165,233,0.3);
    }
  }

  .char-name::before,
  .char-name::after {
    content: '';
    position: absolute;
    top: 50%;
    width: clamp(30px, 10vw, 120px);
    height: 2px;
    background: linear-gradient(90deg, transparent, #0ea5e9, transparent);
    opacity: 0.6;
    box-shadow: 0 0 8px rgba(14,165,233,0.5);
  }

  .char-name::before { right: calc(100% + 16px); }
  .char-name::after  { left: calc(100% + 16px); }

  .char-real-name {
    font-weight: 600;
    font-size: clamp(16px, 4vw, 28px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
  }

  /* ===== WAVEFORM ===== */
  .waveform-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .waveform-layer svg {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 280px;
    transform: translateY(-50%);
    overflow: visible;
  }

  .wave-main {
    fill: none;
    stroke: rgba(14,165,233,0.45);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 6px rgba(14,165,233,0.4));
    animation: waveFlow 6s ease-in-out infinite;
  }

  .wave-glow {
    fill: none;
    stroke: rgba(14,165,233,0.12);
    stroke-width: 10;
    filter: blur(6px);
    animation: waveFlow 6s ease-in-out infinite;
  }

  .wave-highlight {
    fill: none;
    stroke: rgba(14,165,233,0.25);
    stroke-width: 1.5;
    stroke-dasharray: 8 16;
    animation: waveFlow 6s ease-in-out infinite, dashMove 3s linear infinite;
  }

  @keyframes waveFlow {
    0%, 100% { d: path("M0,140 Q80,140 160,140 T320,140 T480,140 T640,140 T800,140 T960,140 T1120,140 T1280,140"); }
    25% { d: path("M0,140 Q80,60 160,140 T320,140 T480,140 T640,140 T800,140 T960,140 T1120,140 T1280,140"); }
    50% { d: path("M0,140 Q80,50 160,140 Q240,230 320,140 Q400,50 480,140 Q560,230 640,140 Q720,50 800,140 Q880,230 960,140 Q1040,50 1120,140 Q1200,230 1280,140"); }
    75% { d: path("M0,140 Q80,70 160,140 Q240,210 320,140 Q400,70 480,140 Q560,210 640,140 Q720,70 800,140 Q880,210 960,140 Q1040,70 1120,140 Q1200,210 1280,140"); }
  }

  @keyframes dashMove {
    0% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -48; }
  }

  .wave-offset {
    fill: none;
    stroke: rgba(14,165,233,0.2);
    stroke-width: 2;
    filter: drop-shadow(0 0 4px rgba(14,165,233,0.3));
    animation: waveFlow2 8s ease-in-out infinite;
  }

  @keyframes waveFlow2 {
    0%, 100% { d: path("M0,140 Q100,140 200,140 T400,140 T600,140 T800,140 T1000,140 T1200,140 T1400,140"); }
    30% { d: path("M0,140 Q100,80 200,140 Q300,200 400,140 Q500,80 600,140 Q700,200 800,140 Q900,80 1000,140 Q1100,200 1200,140 Q1300,80 1400,140"); }
    60% { d: path("M0,140 Q100,55 200,140 Q300,225 400,140 Q500,55 600,140 Q700,225 800,140 Q900,55 1000,140 Q1100,225 1200,140 Q1300,55 1400,140"); }
  }

  /* ===== EQUALIZER BARS ===== */
  .eq-bars {
    position: fixed;
    z-index: 1;
    pointer-events: none;
  }

  .eq-left {
    left: 6%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: flex-end;
  }

  .eq-right {
    right: 6%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: flex-start;
  }

  .eq-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, rgba(14,165,233,0.1), #0ea5e9);
    box-shadow: 0 0 8px rgba(14,165,233,0.4);
  }

  .eq-left .eq-bar:nth-child(1)  { height: 22px; animation: eqPulse 2.2s ease-in-out infinite; }
  .eq-left .eq-bar:nth-child(2)  { height: 38px; animation: eqPulse 2.2s ease-in-out 0.15s infinite; }
  .eq-left .eq-bar:nth-child(3)  { height: 55px; animation: eqPulse 2.2s ease-in-out 0.3s infinite; }
  .eq-left .eq-bar:nth-child(4)  { height: 70px; animation: eqPulse 2.2s ease-in-out 0.45s infinite; }
  .eq-left .eq-bar:nth-child(5)  { height: 55px; animation: eqPulse 2.2s ease-in-out 0.6s infinite; }
  .eq-left .eq-bar:nth-child(6)  { height: 38px; animation: eqPulse 2.2s ease-in-out 0.75s infinite; }
  .eq-left .eq-bar:nth-child(7)  { height: 22px; animation: eqPulse 2.2s ease-in-out 0.9s infinite; }

  .eq-right .eq-bar:nth-child(1)  { height: 28px; animation: eqPulse 2.5s ease-in-out 0.1s infinite; }
  .eq-right .eq-bar:nth-child(2)  { height: 44px; animation: eqPulse 2.5s ease-in-out 0.25s infinite; }
  .eq-right .eq-bar:nth-child(3)  { height: 60px; animation: eqPulse 2.5s ease-in-out 0.4s infinite; }
  .eq-right .eq-bar:nth-child(4)  { height: 76px; animation: eqPulse 2.5s ease-in-out 0.55s infinite; }
  .eq-right .eq-bar:nth-child(5)  { height: 60px; animation: eqPulse 2.5s ease-in-out 0.7s infinite; }
  .eq-right .eq-bar:nth-child(6)  { height: 44px; animation: eqPulse 2.5s ease-in-out 0.85s infinite; }
  .eq-right .eq-bar:nth-child(7)  { height: 28px; animation: eqPulse 2.5s ease-in-out 1.0s infinite; }

  @keyframes eqPulse {
    0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  .vol {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ea5e9;
    box-shadow: 0 0 12px rgba(14,165,233,0.8);
    animation: dotBreathe 3s ease-in-out infinite;
  }

  @keyframes dotBreathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(14,165,233,0.6);
  }

  @media (max-width: 400px) {
    .char-name { font-size: clamp(32px, 10vw, 90px); letter-spacing: 1px; }
    .the-word { letter-spacing: 8px; }
    .char-real-name { letter-spacing: 4px; }
    .theme-label { letter-spacing: 5px; }
    .char-name::before, .char-name::after { display: none; }
    .eq-left, .eq-right { display: none; }
    .waveform-layer svg { height: 180px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="waveform-layer">
  <svg viewBox="0 0 1280 280" preserveAspectRatio="none">
    <path class="wave-glow" d="M0,140 Q160,140 320,140 T640,140 T960,140 T1280,140"/>
    <path class="wave-offset" d="M0,140 Q200,140 400,140 T800,140 T1200,140 T1400,140"/>
    <path class="wave-highlight" d="M0,140 Q160,140 320,140 T640,140 T960,140 T1280,140"/>
    <path class="wave-main" d="M0,140 Q160,140 320,140 T640,140 T960,140 T1280,140"/>
  </svg>
</div>

<div class="eq-bars eq-left">
  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
  <div class="eq-bar"></div>
</div>

<div class="eq-bars eq-right">
  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
  <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
  <div class="eq-bar"></div>
</div>

<div class="title-block">
  <div class="theme-label">Pattern Recognition</div>
  <div class="the-word">The</div>
  <div class="char-name">Wait-For-It</div>
  <div class="char-real-name">Kai</div>
</div>

<div class="vol">
  <div class="vol-dot"></div>
  <div class="vol-text">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const blues = [
  [14, 165, 233],
  [56, 189, 248],
  [2, 132, 199],
  [14, 185, 233],
  [34, 211, 238],
  [6, 182, 212],
  [125, 211, 252]
];

const NUM = 100;
const dots = [];

for (let i = 0; i < NUM; i++) {
  const c = blues[Math.floor(Math.random() * blues.length)];
  dots.push({
    x: Math.random() * W,
    y: H / 2,
    r: 1 + Math.random() * 2.2,
    speed: 0.3 + Math.random() * 0.5,
    waveAmp: H * 0.15 + Math.random() * H * 0.2,
    waveFreq: 0.003 + Math.random() * 0.004,
    phase: Math.random() * Math.PI * 2,
    seed: Math.random() * 1000,
    alpha: 0.6 + Math.random() * 0.4,
    c: c
  });
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);
  const t = time * 0.001;

  ctx.lineWidth = 0.8;
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 8100) {
        const a = (1 - Math.sqrt(d2) / 90) * 0.3;
        const [r, g, b] = dots[i].c;
        ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.stroke();
      }
    }
  }

  for (const d of dots) {
    d.x += d.speed;
    const waveY = H / 2 + Math.sin(d.x * d.waveFreq + d.phase) * d.waveAmp;
    d.y += (waveY - d.y) * 0.04;

    if (d.x > W + 30) {
      d.x = -30;
      d.y = H / 2;
    }

    const [r, g, b] = d.c;
    const pulse = 0.7 + Math.sin(t * 1.5 + d.seed) * 0.3;
    const fa = d.alpha * pulse;

    ctx.save();
    ctx.globalAlpha = fa * 0.4;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 28;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.12)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa * 0.8;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
