<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TARA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Outfit',sans-serif;width:100vw;height:100vh}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.wm-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none}
.wm-topic{font-size:clamp(18px,3.5vw,36px);font-weight:300;color:rgba(6,182,212,0.5);letter-spacing:0.45em;text-transform:uppercase}
.wm-name{font-size:clamp(80px,20vw,300px);font-weight:800;color:#22D3EE;text-shadow:0 0 80px rgba(34,211,238,0.9),0 0 160px rgba(34,211,238,0.6),0 0 250px rgba(34,211,238,0.2);letter-spacing:0.06em;white-space:nowrap;line-height:0.85}
.stamp{position:fixed;bottom:20px;right:20px;z-index:3;pointer-events:none;user-select:none}
.stamp-pill{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 16px;border-radius:100px;background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.5);box-shadow:0 0 30px rgba(34,211,238,0.25),0 0 60px rgba(34,211,238,0.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stamp-dot{width:8px;height:8px;border-radius:50%;background:#22D3EE;box-shadow:0 0 12px rgba(34,211,238,0.9)}
.stamp-txt{font-size:clamp(10px,1.5vw,14px);font-weight:600;color:rgba(34,211,238,0.9);letter-spacing:0.12em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wm-wrap">
  <div class="wm-topic">LOOPS</div>
  <div class="wm-name">TARA</div>
</div>
<div class="stamp">
  <div class="stamp-pill">
    <div class="stamp-dot"></div>
    <div class="stamp-txt">YOU DO THIS TOO</div>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const CR=34,CG=211,CB=238; // Brighter Cyan
let W,H,cx,cy;
const N=180;
let pts=[];
let t0=0,lastPhase='';
let door={w:0,h:0,x:0,y:0,scale:0,alpha:0};
let executeFlash = 0;

function sz(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;
  door.w=Math.min(W,H)*0.24;
  door.h=Math.min(W,H)*0.5;
  door.x=cx;door.y=cy;
  init();
}

function init(){
  pts=[];
  for(let i=0;i<N;i++){
    pts.push({
      x:cx+(Math.random()-0.5)*W,
      y:cy+(Math.random()-0.5)*H,
      vx:(Math.random()-0.5)*0.8,
      vy:(Math.random()-0.5)*0.8,
      trackPos:Math.random(), 
      onTrack:false,
      sz:2+Math.random()*3.5,bright:0.6+Math.random()*0.4,
      trail:[]
    });
  }
  t0=performance.now();lastPhase='';
  executeFlash = 0;
}

// 5s drift, 5s execute, 5s release
const CY=15;
const PH=[
  ['drift1',0,5],
  ['execute',5,10],
  ['drift2',10,15]
];

function getPhase(t){
  const ct=t%CY;
  for(const[n,s,e]of PH)if(ct>=s&&ct<e)return{name:n,p:(ct-s)/(e-s)};
  return{name:'drift1',p:1};
}

function applyPhase(name){
  if(name===lastPhase)return;lastPhase=name;
  if(name==='execute'){
    for(let i=0;i<N;i++){
      // Snap instantly to an even marching line
      pts[i].trackPos=(i/N); 
      pts[i].onTrack=true;
    }
    executeFlash = 1.0; // Trigger bright flash
  } else if(name==='drift2'){
    for(let i=0;i<N;i++){
      const p=pts[i];
      if(p.onTrack){
        const pt=getPerimeterPoint(p.trackPos);
        const dx=pt.x-cx,dy=pt.y-cy,d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
        // Explode outward with high energy
        p.vx=(dx/d)*5+(Math.random()-0.5)*2;
        p.vy=(dy/d)*5+(Math.random()-0.5)*2;
        p.onTrack=false;
      }
    }
  }
}

function getPerimeterPoint(p){
  const hw=door.w/2, hh=door.h/2;
  const len=2*(door.w+door.h);
  let dist=p*len;
  
  if(dist < door.w){ return{x:door.x-hw+dist, y:door.y-hh}; } 
  else if(dist < door.w+door.h){ return{x:door.x+hw, y:door.y-hh+(dist-door.w)}; } 
  else if(dist < 2*door.w+door.h){ return{x:door.x+hw-(dist-door.w-door.h), y:door.y+hh}; } 
  else { return{x:door.x-hw, y:door.y+hh-(dist-2*door.w-door.h)}; }
}

function frame(now){
  const el=(now-t0)/1000;
  const{name,p}=getPhase(el);
  applyPhase(name);

  if(!RM){
    if(name==='drift1'){
      door.scale=0;door.alpha=0;
      for(let i=0;i<N;i++){
        const pt=pts[i];
        pt.vx+=(Math.random()-0.5)*0.2;
        pt.vy+=(Math.random()-0.5)*0.2;
        pt.vx*=0.95;pt.vy*=0.95;
        pt.x+=pt.vx;pt.y+=pt.vy;
      }
    }
    else if(name==='execute'){
      // Door slams down instantly
      if(p<0.05){door.scale=1;door.alpha=1;}
      
      const speed=0.012; // Much faster marching
      for(let i=0;i<N;i++){
        const pt=pts[i];
        pt.trackPos=(pt.trackPos+speed)%1;
        const pos=getPerimeterPoint(pt.trackPos);
        // Snap hard to the track
        pt.x+=(pos.x-pt.x)*0.7; 
        pt.y+=(pos.y-pt.y)*0.7;
      }
    }
    else if(name==='drift2'){
      // Door vanishes quickly
      if(p<0.1){door.alpha=1-p*10; door.scale=1-p*5;}
      else {door.alpha=0; door.scale=0;}
      
      for(let i=0;i<N;i++){
        const pt=pts[i];
        pt.vx+=(Math.random()-0.5)*0.2;
        pt.vy+=(Math.random()-0.5)*0.2;
        pt.vx*=0.95;pt.vy*=0.95;
        pt.x+=pt.vx;pt.y+=pt.vy;
      }
    }

    for(let i=0;i<N;i++){
      const pt=pts[i];
      pt.trail.push({x:pt.x,y:pt.y});
      const maxT=pt.onTrack?18:6; // Long bright trails when executing
      while(pt.trail.length>maxT)pt.trail.shift();
    }
    
    executeFlash *= 0.85; // Fade out the flash
  }

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Draw Door (The Environment Trigger)
  if(door.alpha>0.01){
    const hw=door.w*door.scale/2, hh=door.h*door.scale/2;
    const dx=door.x, dy=door.y;
    
    // Intense Door Glow
    const pulse = 1 + Math.sin(el*15)*0.2; // Energetic pulsing
    const ga=door.alpha*0.35 * pulse;
    const g=ctx.createRadialGradient(dx,dy,0,dx,dy,Math.max(door.w,door.h)*1.2);
    g.addColorStop(0,'rgba('+CR+','+CG+','+CB+','+ga+')');
    g.addColorStop(1,'rgba('+CR+','+CG+','+CB+',0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // Bright Door Frame
    ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+door.alpha+')';
    ctx.lineWidth=4;
    ctx.shadowColor = 'rgba('+CR+','+CG+','+CB+',1)';
    ctx.shadowBlur = 20;
    ctx.strokeRect(dx-hw,dy-hh,hw*2,hh*2);
    ctx.shadowBlur = 0; // Reset
    
    // Doorknob
    ctx.beginPath();
    ctx.arc(dx+hw-8, dy, 4, 0, Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+door.alpha+')';
    ctx.fill();
  }

  // Draw trails
  for(let i=0;i<N;i++){
    const pt=pts[i];
    if(pt.trail.length<2)continue;
    for(let j=1;j<pt.trail.length;j++){
      const f=j/pt.trail.length;
      const a=f*0.6*pt.bright; // Brighter trails
      ctx.beginPath();
      ctx.moveTo(pt.trail[j-1].x,pt.trail[j-1].y);
      ctx.lineTo(pt.trail[j].x,pt.trail[j].y);
      ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+a+')';
      ctx.lineWidth=pt.sz*f*1.8;ctx.lineCap='round';ctx.stroke();
    }
  }

  // Draw particles with intense glow
  for(let i=0;i<N;i++){
    const pt=pts[i];
    const a=pt.onTrack?1:pt.bright;
    const s=pt.onTrack?pt.sz*1.5:pt.sz; // Particles grow when on track

    // Wide outer glow
    ctx.beginPath();ctx.arc(pt.x,pt.y,s*6,0,Math.PI*2);
    ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.1)+')';ctx.fill();
    
    // Mid glow
    ctx.beginPath();ctx.arc(pt.x,pt.y,s*2.5,0,Math.PI*2);
    ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.3)+')';ctx.fill();
    
    // Core
    ctx.beginPath();ctx.arc(pt.x,pt.y,s,0,Math.PI*2);
    ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+(a*0.9)+')';ctx.fill();
    
    // White hot center when executing
    if(pt.onTrack){
      ctx.beginPath();ctx.arc(pt.x,pt.y,s*0.4,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();
    }
  }

  // Execution flash overlay
  if(executeFlash > 0.01){
    ctx.fillStyle='rgba(255,255,255,'+executeFlash+')';
    ctx.fillRect(0,0,W,H);
  }

  if(!RM)requestAnimationFrame(frame);
}
sz();requestAnimationFrame(frame);window.addEventListener('resize',sz);
</script>
</body>
</html>
