<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Predictor — Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  /* ===== TITLE BLOCK ===== */
  .title-block {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  .theme-label {
    font-weight: 700;
    font-size: clamp(10px, 2.5vw, 16px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(168,85,247,0.45);
    margin-bottom: 10px;
    animation: labelPulse 3s ease-in-out infinite;
  }

  @keyframes labelPulse {
    0%, 100% { color: rgba(168,85,247,0.35); }
    50% { color: rgba(168,85,247,0.65); }
  }

  .the-word {
    font-weight: 800;
    font-size: clamp(14px, 3.5vw, 24px);
    letter-spacing: 14px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 2px;
  }

  .char-name {
    font-weight: 900;
    font-size: clamp(52px, 15vw, 180px);
    line-height: 0.95;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a855f7;
    text-shadow:
      0 0 20px rgba(168,85,247,0.6),
      0 0 60px rgba(168,85,247,0.3),
      0 0 120px rgba(168,85,247,0.15);
    animation: nameGlow 3s ease-in-out infinite;
    position: relative;
  }

  @keyframes nameGlow {
    0%, 100% {
      text-shadow:
        0 0 20px rgba(168,85,247,0.5),
        0 0 60px rgba(168,85,247,0.25),
        0 0 120px rgba(168,85,247,0.1);
    }
    50% {
      text-shadow:
        0 0 30px rgba(168,85,247,0.8),
        0 0 80px rgba(168,85,247,0.4),
        0 0 160px rgba(168,85,247,0.2);
    }
  }

  .char-name::before,
  .char-name::after {
    content: '';
    position: absolute;
    top: 50%;
    width: clamp(30px, 10vw, 120px);
    height: 2px;
    background: linear-gradient(90deg, transparent, #a855f7, transparent);
    opacity: 0.4;
  }

  .char-name::before { right: calc(100% + 16px); }
  .char-name::after  { left: calc(100% + 16px); }

  .char-real-name {
    font-weight: 600;
    font-size: clamp(16px, 4vw, 28px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    margin-top: 8px;
  }

  /* ===== SPEED LINES ===== */
  .speed-lines {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .sl {
    position: absolute;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent 0%, #a855f7 30%, #c084fc 60%, transparent 100%);
    box-shadow: 0 0 8px rgba(168,85,247,0.5);
  }

  .sl:nth-child(1)  { top: 8%;  width: 50%; animation: shoot 1.1s linear infinite;    --a: -20deg; }
  .sl:nth-child(2)  { top: 22%; width: 60%; animation: shoot 1.4s linear 0.3s infinite; --a: -15deg; }
  .sl:nth-child(3)  { top: 38%; width: 40%; animation: shoot 0.9s linear 0.6s infinite; --a: -26deg; }
  .sl:nth-child(4)  { top: 55%; width: 55%; animation: shoot 1.3s linear 0.1s infinite; --a: -18deg; }
  .sl:nth-child(5)  { top: 70%; width: 45%; animation: shoot 1.0s linear 0.8s infinite; --a: -23deg; }
  .sl:nth-child(6)  { top: 85%; width: 52%; animation: shoot 1.2s linear 0.5s infinite; --a: -16deg; }
  .sl:nth-child(7)  { top: 15%; width: 35%; animation: shoot 1.5s linear 0.7s infinite; --a: -28deg; }
  .sl:nth-child(8)  { top: 48%; width: 48%; animation: shoot 1.05s linear 0.4s infinite; --a: -21deg; }
  .sl:nth-child(9)  { top: 78%; width: 38%; animation: shoot 1.35s linear 0.9s infinite; --a: -14deg; }

  @keyframes shoot {
    0%   { left: -65%; transform: rotate(var(--a)); opacity: 0; }
    3%   { opacity: 0.9; }
    97%  { opacity: 0.9; }
    100% { left: 115%; transform: rotate(var(--a)); opacity: 0; }
  }

  /* ===== STAMP — CLEAR ===== */
  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  /* ===== VOL ===== */
  .vol {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a855f7;
    box-shadow: 0 0 10px rgba(168,85,247,0.7);
    animation: dotBlink 2s ease-in-out infinite;
  }

  @keyframes dotBlink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(168,85,247,0.45);
  }

  @media (max-width: 400px) {
    .char-name { letter-spacing: 2px; }
    .the-word { letter-spacing: 8px; }
    .char-real-name { letter-spacing: 4px; }
    .theme-label { letter-spacing: 5px; }
    .char-name::before, .char-name::after { display: none; }
    .stamp-text { font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="speed-lines">
  <div class="sl"></div><div class="sl"></div><div class="sl"></div>
  <div class="sl"></div><div class="sl"></div><div class="sl"></div>
  <div class="sl"></div><div class="sl"></div><div class="sl"></div>
</div>

<div class="title-block">
  <div class="theme-label">Pattern Recognition</div>
  <div class="the-word">The</div>
  <div class="char-name">Predictor</div>
  <div class="char-real-name">Mia</div>
</div>

<div class="vol">
  <div class="vol-dot"></div>
  <div class="vol-text">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ===== VIOLET COLOR VARIATIONS ===== */
const violets = [
  [168, 85, 247],
  [192, 132, 252],
  [147, 51, 234],
  [180, 100, 255],
  [139, 92, 246],
  [200, 150, 255],
  [124, 58, 237]
];

/* ===== PARTICLES ===== */
const NUM = 120;
const dots = [];

for (let i = 0; i < NUM; i++) {
  const y = Math.random() * H;
  const c = violets[Math.floor(Math.random() * violets.length)];
  dots.push({
    x: Math.random() * W,
    y: y,
    baseY: y,
    speed: 1.8 + Math.random() * 3.5,
    waveAmp: 6 + Math.random() * 28,
    waveFreq: 0.002 + Math.random() * 0.004,
    r: 1 + Math.random() * 2.2,
    seed: Math.random() * 1000,
    alpha: 0.6 + Math.random() * 0.4,
    c: c
  });
}

/* ===== DARTS ===== */
const darts = [];
const DART_COUNT = 4;

function spawnDart() {
  const angle = (-20 - Math.random() * 15) * Math.PI / 180;
  const speed = 6 + Math.random() * 6;
  const startY = H * 0.15 + Math.random() * H * 0.7;
  return {
    x: -80,
    y: startY,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    angle: angle,
    size: 0.8 + Math.random() * 0.6,
    alpha: 0,
    phase: 'in',
    trail: []
  };
}

for (let i = 0; i < DART_COUNT; i++) {
  const d = spawnDart();
  d.x = -80 - i * (W / DART_COUNT) * 1.5;
  darts.push(d);
}

function drawDart(d) {
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(d.angle);

  const s = d.size;

  /* Trail */
  if (d.trail.length > 1) {
    for (let i = 1; i < d.trail.length; i++) {
      const t = i / d.trail.length;
      ctx.save();
      ctx.globalAlpha = t * d.alpha * 0.3;
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 1.5 * s * t;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(d.trail[i - 1].x - d.x, d.trail[i - 1].y - d.y);
      ctx.lineTo(d.trail[i].x - d.x, d.trail[i].y - d.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* Glow behind tip */
  ctx.save();
  ctx.globalAlpha = d.alpha * 0.4;
  ctx.shadowColor = 'rgba(168,85,247,1)';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(28 * s, 0, 8 * s, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(168,85,247,0.15)';
  ctx.fill();
  ctx.restore();

  /* Body — slim cylinder */
  ctx.save();
  ctx.globalAlpha = d.alpha;
  ctx.fillStyle = '#c0c0c0';
  ctx.shadowColor = 'rgba(168,85,247,0.8)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.roundRect(-20 * s, -2 * s, 40 * s, 4 * s, 2 * s);
  ctx.fill();
  ctx.restore();

  /* Body highlight stripe */
  ctx.save();
  ctx.globalAlpha = d.alpha * 0.5;
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.roundRect(-15 * s, -1 * s, 30 * s, 1.5 * s, 1 * s);
  ctx.fill();
  ctx.restore();

  /* Grip rings */
  ctx.save();
  ctx.globalAlpha = d.alpha * 0.4;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const rx = (-18 + i * 5) * s;
    ctx.beginPath();
    ctx.moveTo(rx, -2.2 * s);
    ctx.lineTo(rx, 2.2 * s);
    ctx.stroke();
  }
  ctx.restore();

  /* Needle tip */
  ctx.save();
  ctx.globalAlpha = d.alpha;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(255,255,255,0.8)';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(28 * s, 0);
  ctx.lineTo(20 * s, -2.5 * s);
  ctx.lineTo(20 * s, 2.5 * s);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Flights (tail fins) */
  ctx.save();
  ctx.globalAlpha = d.alpha * 0.9;
  /* Top fin */
  ctx.fillStyle = '#a855f7';
  ctx.shadowColor = 'rgba(168,85,247,0.6)';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-20 * s, 0);
  ctx.lineTo(-32 * s, -10 * s);
  ctx.lineTo(-24 * s, 0);
  ctx.closePath();
  ctx.fill();
  /* Bottom fin */
  ctx.beginPath();
  ctx.moveTo(-20 * s, 0);
  ctx.lineTo(-32 * s, 10 * s);
  ctx.lineTo(-24 * s, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Flight accent lines */
  ctx.save();
  ctx.globalAlpha = d.alpha * 0.5;
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-22 * s, -4 * s);
  ctx.lineTo(-29 * s, -8 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-22 * s, 4 * s);
  ctx.lineTo(-29 * s, 8 * s);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);
  const t = time * 0.001;

  /* Update and draw darts */
  for (let i = 0; i < darts.length; i++) {
    const d = darts[i];
    d.x += d.vx;
    d.y += d.vy;

    /* Trail points */
    d.trail.push({ x: d.x, y: d.y });
    if (d.trail.length > 18) d.trail.shift();

    /* Fade in / out */
    if (d.x > 0 && d.alpha < 1 && d.phase === 'in') {
      d.alpha = Math.min(1, d.alpha + 0.06);
    }
    if (d.x > W * 0.75) {
      d.phase = 'out';
      d.alpha = Math.max(0, d.alpha - 0.04);
    }

    /* Reset when off screen */
    if (d.x > W + 100 || d.alpha <= 0) {
      darts[i] = spawnDart();
    }

    drawDart(d);
  }

  /* Draw particle connections */
  ctx.lineWidth = 0.8;
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const dist = dx * dx + dy * dy;
      if (dist < 5600) {
        const a = (1 - Math.sqrt(dist) / 75) * 0.3;
        ctx.strokeStyle = `rgba(168,85,247,${a})`;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.stroke();
      }
    }
  }

  /* Draw particles */
  for (const d of dots) {
    d.x += d.speed;
    d.y = d.baseY + Math.sin(d.x * d.waveFreq + d.seed) * d.waveAmp;

    if (d.x > W + 40) {
      d.x = -40;
      d.baseY = Math.random() * H;
    }

    const [r, g, b] = d.c;
    const pulse = 0.75 + Math.sin(t * 3 + d.seed) * 0.25;
    const fa = d.alpha * pulse;

    /* Trail */
    const trailLen = d.speed * 8;
    const grad = ctx.createLinearGradient(d.x - trailLen, d.y, d.x, d.y);
    grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},${(fa * 0.4).toFixed(2)})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = d.r * 1.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(d.x - trailLen, d.y);
    ctx.lineTo(d.x, d.y);
    ctx.stroke();

    /* Outer glow */
    ctx.save();
    ctx.globalAlpha = fa * 0.35;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 26;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 2.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.1)`;
    ctx.fill();
    ctx.restore();

    /* Core */
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    /* White center */
    ctx.save();
    ctx.globalAlpha = fa * 0.75;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
