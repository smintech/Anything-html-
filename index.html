
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts of a Clock - Classroom Reference Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap');

        :root {
            --blue-hour: #0056b3;
            --red-minute: #bd0000;
            --clock-face-bg: #f8fafc;
            --text-dark: #0f172a;
            --label-bg: #ffffff;
            --border-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-dark);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- HEADER (EXTRA LARGE) --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            color: #1e293b;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-weight: 900;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: clamp(1rem, 2vw, 1.4rem);
        }

        /* --- POSTER CONTAINER --- */
        .poster-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 6px solid white;
        }

        /* --- DIAGRAM AREA --- */
        .diagram-area {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 1.35;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-canvas {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- HIGH CONTROST LABELS --- */
        .diagram-label {
            background: var(--label-bg);
            border: 5px solid #64748b;
            border-radius: 20px;
            padding: 18px 22px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            font-size: 1.15rem;
            font-weight: 900;
            line-height: 1.3;
            max-width: 250px;
            text-align: center;
        }

        .diagram-label strong {
            font-family: 'Fredoka', sans-serif;
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        /* --- GOLDEN RULES (MAXIMUM SIZE BANNER) --- */
        .takeaway-banner {
            width: 100%;
            background: #fef08a; /* Bright Yellow */
            border: 5px dashed #ca8a04;
            color: #451a03;
            padding: 24px;
            border-radius: 30px;
            text-align: center;
            font-size: clamp(1.3rem, 3.5vw, 2rem);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(202, 138, 4, 0.1);
        }

        .takeaway-rule {
            font-family: 'Fredoka', sans-serif;
        }

        .quarter-tag {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            fill: #0d9488;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Parts of a Clock</h1>
        <div class="subtitle">Primary 1 Mathematics Reference Poster</div>
    </header>

    <main class="poster-container">
        
        <!-- LARGE HIGH-CONTRAST SVG DIAGRAM -->
        <div class="diagram-area">
            <svg class="svg-canvas" viewBox="0 0 1100 800">
                <!-- Marker Definitions for Extra Large Arrowheads -->
                <defs>
                    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
                    </marker>
                    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue-hour)" />
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--red-minute)" />
                    </marker>
                </defs>

                <!-- Clock Back Shadow -->
                <circle cx="550" cy="404" r="230" fill="rgba(0,0,0,0.04)" />
                
                <!-- MAIN CLOCK FACE -->
                <circle cx="550" cy="400" r="230" fill="var(--clock-face-bg)" stroke="#1e293b" stroke-width="12" />
                <circle cx="550" cy="400" r="208" fill="white" />

                <!-- NUMBERS 1-12 (EXTRA LARGE AND BOLDEST FONT) -->
                <g>
                    <!-- Quarter Markers (Teal & Mega-Sized) -->
                    <text x="550" y="248" text-anchor="middle" font-family="Fredoka" font-size="52" font-weight="bold" fill="#0d9488">12</text>
                    <text x="715" y="418" text-anchor="middle" font-family="Fredoka" font-size="52" font-weight="bold" fill="#0d9488">3</text>
                    <text x="550" y="588" text-anchor="middle" font-family="Fredoka" font-size="52" font-weight="bold" fill="#0d9488">6</text>
                    <text x="385" y="418" text-anchor="middle" font-family="Fredoka" font-size="52" font-weight="bold" fill="#0d9488">9</text>
                    
                    <!-- Other Main Numbers (Super Bold Gray) -->
                    <text x="635" y="285" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">1</text>
                    <text x="692" y="342" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">2</text>
                    <text x="692" y="492" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">4</text>
                    <text x="635" y="550" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">5</text>
                    <text x="465" y="550" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">7</text>
                    <text x="408" y="492" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">8</text>
                    <text x="408" y="342" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">10</text>
                    <text x="465" y="285" text-anchor="middle" font-family="Fredoka" font-size="36" font-weight="bold" fill="#475569">11</text>

                    <!-- Quarter Helper Labels -->
                    <text x="550" y="202" text-anchor="middle" class="quarter-tag">Quarter!</text>
                    <text x="715" y="458" text-anchor="middle" class="quarter-tag">Quarter!</text>
                    <text x="550" y="622" text-anchor="middle" class="quarter-tag">Quarter!</text>
                    <text x="385" y="458" text-anchor="middle" class="quarter-tag">Quarter!</text>
                </g>

                <!-- HOUR HAND (Short, Very Thick Blue - Pointing to 3) -->
                <line x1="550" y1="400" x2="655" y2="400" stroke="var(--blue-hour)" stroke-width="24" stroke-linecap="round" />

                <!-- MINUTE HAND (Long, Thick Red - Pointing to 12) -->
                <line x1="550" y1="400" x2="550" y2="265" stroke="var(--red-minute)" stroke-width="12" stroke-linecap="round" />

                <!-- CENTER POINT (Large Pin) -->
                <circle cx="550" cy="400" r="14" fill="var(--red-minute)" stroke="white" stroke-width="4" />

                <!-- EXTRA THICK DOTTED POINTER LINES & ARROWS -->
                <g>
                    <!-- To Clock Face (Thickened to 3.5px) -->
                    <path d="M 270 140 Q 320 120, 390 190" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Numbers -->
                    <path d="M 270 320 Q 330 310, 380 320" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Center Point -->
                    <path d="M 270 510 Q 380 540, 530 420" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Minute Hand (Red Pointer) -->
                    <path d="M 830 220 L 570 300" stroke="var(--red-minute)" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-red)" />
                    
                    <!-- To Hour Hand (Blue Pointer) -->
                    <path d="M 830 500 L 630 415" stroke="var(--blue-hour)" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-blue)" />
                </g>

                <!-- EMBEDDED MEGA LABEL CARDS -->
                
                <!-- 1. CLOCK FACE -->
                <foreignObject x="10" y="60" width="250" height="150">
                    <div class="diagram-label" style="border-color: #475569;">
                        <strong style="color: #334155;">CLOCK FACE</strong>
                        The big, flat circle that holds the numbers.
                    </div>
                </foreignObject>

                <!-- 2. NUMBERS 1-12 -->
                <foreignObject x="10" y="250" width="250" height="150">
                    <div class="diagram-label" style="border-color: #0d9488;">
                        <strong style="color: #0d9488;">NUMBERS 1-12</strong>
                        They help us tell the hours and minutes.
                    </div>
                </foreignObject>

                <!-- 3. CENTER -->
                <foreignObject x="10" y="440" width="250" height="150">
                    <div class="diagram-label" style="border-color: var(--red-minute);">
                        <strong style="color: var(--red-minute);">CENTER</strong>
                        The middle pin that holds the hands.
                    </div>
                </foreignObject>

                <!-- 4. MINUTE HAND -->
                <foreignObject x="840" y="150" width="250" height="160">
                    <div class="diagram-label" style="border-color: var(--red-minute); color: #7f1d1d;">
                        <strong style="color: var(--red-minute);">MINUTE HAND</strong>
                        The <span style="text-decoration: underline;">long, thin</span> hand. It shows the minutes!
                    </div>
                </foreignObject>

                <!-- 5. HOUR HAND -->
                <foreignObject x="840" y="440" width="250" height="160">
                    <div class="diagram-label" style="border-color: var(--blue-hour); color: #0c4a6e;">
                        <strong style="color: var(--blue-hour);">HOUR HAND</strong>
                        The <span style="text-decoration: underline;">short, thick</span> hand. It shows the hours!
                    </div>
                </foreignObject>
            </svg>
        </div>

        <!-- GOLDEN RULE MESSAGE (MAX SIZE & READABILITY BANNER) -->
        <div class="takeaway-banner">
            <span>📢</span>
            <span class="takeaway-rule">
                The <strong>short hand</strong> shows hours, and the <strong>long hand</strong> shows minutes!
            </span>
        </div>

    </main>

</body>
</html>
