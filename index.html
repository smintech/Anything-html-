<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NADIA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Outfit',sans-serif;width:100vw;height:100vh}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.wm-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none}
.wm-topic{font-size:clamp(18px,3.5vw,36px);font-weight:300;color:rgba(245,158,11,0.35);letter-spacing:0.45em;text-transform:uppercase}
.wm-name{font-size:clamp(80px,20vw,300px);font-weight:800;color:#F59E0B;text-shadow:0 0 60px rgba(245,158,11,0.7),0 0 120px rgba(245,158,11,0.4),0 0 200px rgba(245,158,11,0.15);letter-spacing:0.06em;white-space:nowrap;line-height:0.85}
.stamp{position:fixed;bottom:20px;right:20px;z-index:3;pointer-events:none;user-select:none}
.stamp-pill{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 16px;border-radius:100px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.35);box-shadow:0 0 20px rgba(245,158,11,0.15),0 0 50px rgba(245,158,11,0.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stamp-dot{width:6px;height:6px;border-radius:50%;background:#F59E0B;box-shadow:0 0 8px rgba(245,158,11,0.6)}
.stamp-txt{font-size:clamp(10px,1.5vw,14px);font-weight:600;color:rgba(245,158,11,0.7);letter-spacing:0.12em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wm-wrap">
  <div class="wm-topic">PATTERN</div>
  <div class="wm-name">NADIA</div>
</div>
<div class="stamp">
  <div class="stamp-pill">
    <div class="stamp-dot"></div>
    <div class="stamp-txt">YOU DO THIS TOO</div>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const CR=245,CG=158,CB=11;
let W,H,cx,cy,bR;
const ORBITS=[
  {r:0.28,n:4,spd:0.024},
  {r:0.42,n:3,spd:0.018},
  {r:0.58,n:4,spd:0.012},
  {r:0.75,n:3,spd:0.008},
  {r:0.90,n:5,spd:0.005}
];
const TL=60;
let pts=[];
let pulse=0;
function sz(){
  const d=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
  cx=W/2;cy=H/2;
  bR=Math.min(W,H)*0.38;
  initP();
}
function initP(){
  pts=[];
  ORBITS.forEach(o=>{
    for(let i=0;i<o.n;i++){
      pts.push({
        rad:bR*o.r,
        a:(Math.PI*2/o.n)*i,
        spd:o.spd,
        tr:[],
        sz:2.5+Math.random()*2.5,
        bright:0.6+Math.random()*0.4
      });
    }
  });
}
function dot(x,y,s,a,glow){
  if(glow){
    const g=ctx.createRadialGradient(x,y,0,x,y,s*6);
    g.addColorStop(0,'rgba('+CR+','+CG+','+CB+','+(a*0.25)+')');
    g.addColorStop(1,'rgba('+CR+','+CG+','+CB+',0)');
    ctx.fillStyle=g;
    ctx.fillRect(x-s*6,y-s*6,s*12,s*12);
  }
  ctx.beginPath();ctx.arc(x,y,Math.max(0.5,s),0,Math.PI*2);
  ctx.fillStyle='rgba('+CR+','+CG+','+CB+','+a+')';ctx.fill();
}
function frame(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(!RM)pulse+=0.025;
  const pScale=1+Math.sin(pulse)*0.04;
  ORBITS.forEach(o=>{
    const rad=bR*o.r*pScale;
    const a=0.1+Math.sin(pulse+o.r*4)*0.04;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
    ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+a+')';
    ctx.lineWidth=1.5;ctx.stroke();
  });
  pts.forEach(p=>{
    if(!RM)p.a+=p.spd;
    const pr=p.rad*pScale;
    const x=cx+Math.cos(p.a)*pr,y=cy+Math.sin(p.a)*pr;
    p.tr.push({x,y});if(p.tr.length>TL)p.tr.shift();
    if(p.tr.length>1){
      for(let i=1;i<p.tr.length;i++){
        const prev=p.tr[i-1],cur=p.tr[i],f=i/p.tr.length;
        ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(cur.x,cur.y);
        ctx.strokeStyle='rgba('+CR+','+CG+','+CB+','+(f*0.55*p.bright)+')';
        ctx.lineWidth=p.sz*f*2.2;ctx.lineCap='round';ctx.stroke();
      }
    }
    dot(x,y,p.sz*1.2,1*p.bright,true);
    dot(x,y,p.sz*0.6,1,true);
  });
  if(!RM)requestAnimationFrame(frame);
}
sz();frame();
window.addEventListener('resize',sz);
</script>
</body>
</html>
