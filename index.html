<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wait-For-It — Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
  }

  .intro.show { animation: introShow 5s ease-in-out forwards; }

  @keyframes introShow {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .intro-label {
    font-weight: 700;
    font-size: clamp(10px, 2.2vw, 14px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(14,165,233,0.7);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeDown 5s ease-in-out forwards;
  }

  @keyframes fadeDown {
    0%, 8%   { opacity: 0; transform: translateY(-15px); }
    14%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-10px); }
  }

  .intro-title {
    font-weight: 900;
    font-size: clamp(36px, 10vw, 110px);
    line-height: 1;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px rgba(14,165,233,0.5), 0 0 80px rgba(14,165,233,0.2);
    opacity: 0;
    animation: titleIn 5s ease-in-out forwards;
  }

  @keyframes titleIn {
    0%, 10%  { opacity: 0; transform: scaleX(0.85); letter-spacing: 12px; }
    18%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    82%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    100%     { opacity: 0; transform: scaleX(1.02); letter-spacing: 4px; }
  }

  .intro-line-wrap {
    width: clamp(200px, 50vw, 500px);
    height: 2px;
    margin: 18px 0;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: lineIn 5s ease-in-out forwards;
  }

  @keyframes lineIn {
    0%, 18%  { opacity: 0; }
    24%      { opacity: 1; }
    82%      { opacity: 1; }
    100%     { opacity: 0; }
  }

  .intro-line-bg { position: absolute; inset: 0; background: rgba(255,255,255,0.06); }

  .intro-line-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8, #0ea5e9);
    box-shadow: 0 0 14px rgba(14,165,233,0.6);
    animation: lineGrow 5s ease-in-out forwards;
  }

  @keyframes lineGrow {
    0%, 18%  { width: 0; }
    30%      { width: 100%; }
    82%      { width: 100%; }
    100%     { width: 0; }
  }

  .intro-sub {
    font-weight: 400;
    font-size: clamp(14px, 3.5vw, 22px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    opacity: 0;
    animation: fadeUp 5s ease-in-out forwards;
  }

  @keyframes fadeUp {
    0%, 22%  { opacity: 0; transform: translateY(12px); }
    30%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-8px); }
  }

  .subtext-stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .subtext-stage.active { opacity: 1; }

  .sub-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 24px 36px;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
    animation: subIn 5s ease-in-out forwards;
  }

  @keyframes subIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.95); }
    10%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-8px) scale(0.98); }
  }

  .sub-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    bottom: 15%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent), 0 0 35px var(--accent-glow);
  }

  .sub-card::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-glow), transparent 50%, var(--accent-glow));
    z-index: -1;
    opacity: 0.4;
    animation: cardGlow 2s ease-in-out infinite;
  }

  @keyframes cardGlow {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  .sub-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent-bg);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 18px var(--accent-glow);
  }

  .sub-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px var(--accent));
  }

  .sub-text {
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    letter-spacing: 0.3px;
  }

  .sub-text .dim { color: rgba(255,255,255,0.45); font-weight: 400; }

  .wave-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .wave-bg svg {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 200px;
    transform: translateY(-50%);
  }

  .wave-bg-line {
    fill: none;
    stroke: rgba(14,165,233,0.15);
    stroke-width: 1.5;
    animation: bgWave 8s ease-in-out infinite;
  }

  @keyframes bgWave {
    0%, 100% { d: path("M0,100 Q160,100 320,100 T640,100 T960,100 T1280,100"); }
    50% { d: path("M0,100 Q80,50 160,100 Q240,150 320,100 Q400,50 480,100 Q560,150 640,100 Q720,50 800,100 Q880,150 960,100 Q1040,50 1120,100 Q1200,150 1280,100"); }
  }

  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  .vol-badge {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ea5e9;
    box-shadow: 0 0 12px rgba(14,165,233,0.8);
    animation: vdb 3s ease-in-out infinite;
  }

  @keyframes vdb { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(14,165,233,0.6);
  }

  @media (max-width: 400px) {
    .sub-card { padding: 18px 24px; gap: 14px; }
    .sub-icon { width: 36px; height: 36px; }
    .sub-icon svg { width: 17px; height: 17px; }
    .intro-title { letter-spacing: 0; }
    .intro-sub { letter-spacing: 3px; }
    .intro-label { letter-spacing: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="wave-bg">
  <svg viewBox="0 0 1280 200" preserveAspectRatio="none">
    <path class="wave-bg-line" d="M0,100 Q160,100 320,100 T640,100 T960,100 T1280,100"/>
  </svg>
</div>

<div class="intro" id="intro">
  <div class="intro-label" id="iLabel">Pattern Recognition</div>
  <div class="intro-title" id="iTitle">The Wait-For-It</div>
  <div class="intro-line-wrap">
    <div class="intro-line-bg"></div>
    <div class="intro-line-fill"></div>
  </div>
  <div class="intro-sub" id="iSub">Kai</div>
</div>

<div class="subtext-stage" id="subStage"></div>

<div class="vol-badge">
  <div class="vol-dot"></div>
  <div class="vol-text" id="volText">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
const INTRO = {
  label: "Pattern Recognition",
  title: "The Wait-For-It",
  sub: "Kai",
  vol: "Vol.2",
  duration: 5000
};

const SUBTEXTS = [
  {
    icon: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    text: 'One album. <span class="dim">No phone. No skipping.</span>',
    color: '#0ea5e9'
  },
  {
    icon: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    text: 'First ten minutes <span class="dim">were brutal</span>',
    color: '#f43f5e'
  },
  {
    icon: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    text: 'Then he heard a bass line <span class="dim">he\'d never noticed</span>',
    color: '#10b981'
  },
  {
    icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    text: 'On a song he\'d heard <span class="dim">a hundred times</span>',
    color: '#f59e0b'
  },
  {
    icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    text: 'The slow patterns <span class="dim">hit different</span>',
    color: '#0ea5e9'
  }
];

const SUB_DURATION = 5000;

document.getElementById('iLabel').textContent = INTRO.label;
document.getElementById('iTitle').textContent = INTRO.title;
document.getElementById('iSub').textContent = INTRO.sub;
document.getElementById('volText').textContent = INTRO.vol;

const subStage = document.getElementById('subStage');

function showSubtext(index) {
  subStage.innerHTML = '';
  subStage.classList.remove('active');
  if (index >= SUBTEXTS.length) { startIntro(); return; }

  const item = SUBTEXTS[index];
  const c = item.color;
  const card = document.createElement('div');
  card.className = 'sub-card';
  card.style.setProperty('--accent', c);
  card.style.setProperty('--accent-glow', c + '40');
  card.style.setProperty('--accent-bg', c + '18');
  card.innerHTML = `
    <div class="sub-icon"><svg viewBox="0 0 24 24">${item.icon}</svg></div>
    <div class="sub-text">${item.text}</div>
  `;
  subStage.appendChild(card);
  requestAnimationFrame(() => subStage.classList.add('active'));
  setTimeout(() => showSubtext(index + 1), SUB_DURATION);
}

const introEl = document.getElementById('intro');

function startIntro() {
  introEl.classList.remove('show');
  introEl.style.opacity = '0';
  requestAnimationFrame(() => introEl.classList.add('show'));
  setTimeout(() => {
    introEl.classList.remove('show');
    introEl.style.opacity = '0';
    setTimeout(() => showSubtext(0), 400);
  }, INTRO.duration);
}

startIntro();

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const blues = [
  [14, 165, 233], [56, 189, 248], [2, 132, 199],
  [34, 211, 238], [6, 182, 212]
];

const NUM = 65;
const dots = [];

for (let i = 0; i < NUM; i++) {
  const c = blues[Math.floor(Math.random() * blues.length)];
  dots.push({
    x: Math.random() * W, y: H / 2,
    r: 0.8 + Math.random() * 1.6,
    speed: 0.25 + Math.random() * 0.4,
    waveAmp: H * 0.12 + Math.random() * H * 0.2,
    waveFreq: 0.003 + Math.random() * 0.004,
    phase: Math.random() * Math.PI * 2,
    seed: Math.random() * 1000,
    alpha: 0.5 + Math.random() * 0.5,
    c: c
  });
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);
  const t = time * 0.001;

  for (const d of dots) {
    d.x += d.speed;
    const waveY = H / 2 + Math.sin(d.x * d.waveFreq + d.phase) * d.waveAmp;
    d.y += (waveY - d.y) * 0.04;
    if (d.x > W + 30) { d.x = -30; d.y = H / 2; }

    const [r, g, b] = d.c;
    const pulse = 0.65 + Math.sin(t * 1.5 + d.seed) * 0.35;
    const fa = d.alpha * pulse;

    ctx.save();
    ctx.globalAlpha = fa * 0.35;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.12)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa * 0.7;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
