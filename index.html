<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Skipper — Devin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  .title-block {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  .theme-label {
    font-weight: 700;
    font-size: clamp(10px, 2.5vw, 16px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(249,115,22,0.45);
    margin-bottom: 10px;
    animation: labelFlicker 4s steps(1) infinite;
  }

  @keyframes labelFlicker {
    0%, 100% { color: rgba(249,115,22,0.45); }
    15% { color: rgba(249,115,22,0.6); }
    16% { color: rgba(249,115,22,0.3); }
    17% { color: rgba(249,115,22,0.55); }
    50% { color: rgba(249,115,22,0.4); }
    72% { color: rgba(249,115,22,0.65); }
    73% { color: rgba(249,115,22,0.35); }
    74% { color: rgba(249,115,22,0.5); }
  }

  .the-word {
    font-weight: 800;
    font-size: clamp(14px, 3.5vw, 24px);
    letter-spacing: 14px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 2px;
  }

  .char-name {
    font-weight: 900;
    font-size: clamp(52px, 15vw, 180px);
    line-height: 0.95;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f97316;
    text-shadow: 0 0 20px rgba(249,115,22,0.6), 0 0 60px rgba(249,115,22,0.3), 0 0 120px rgba(249,115,22,0.15);
    position: relative;
    animation: nameGlitch 3s steps(1) infinite;
  }

  @keyframes nameGlitch {
    0%, 100% { text-shadow: 0 0 20px rgba(249,115,22,0.5), 0 0 60px rgba(249,115,22,0.25); transform: translate(0, 0); }
    10% { transform: translate(-2px, 1px); text-shadow: -3px 0 rgba(239,68,68,0.5), 3px 0 rgba(59,130,246,0.5), 0 0 60px rgba(249,115,22,0.3); }
    11% { transform: translate(0, 0); text-shadow: 0 0 20px rgba(249,115,22,0.5), 0 0 60px rgba(249,115,22,0.25); }
    40% { transform: translate(0, 0); }
    41% { transform: translate(3px, -1px); text-shadow: -4px 0 rgba(239,68,68,0.6), 4px 0 rgba(59,130,246,0.6), 0 0 80px rgba(249,115,22,0.4); }
    42% { transform: translate(-1px, 0); }
    43% { transform: translate(0, 0); text-shadow: 0 0 20px rgba(249,115,22,0.5), 0 0 60px rgba(249,115,22,0.25); }
    70% { transform: translate(0, 0); }
    71% { transform: translate(2px, 2px); text-shadow: -2px 0 rgba(239,68,68,0.4), 2px 0 rgba(59,130,246,0.4); }
    72% { transform: translate(0, 0); text-shadow: 0 0 20px rgba(249,115,22,0.5), 0 0 60px rgba(249,115,22,0.25); }
  }

  .char-name::before,
  .char-name::after {
    content: '';
    position: absolute;
    top: 50%;
    width: clamp(30px, 10vw, 120px);
    height: 2px;
    background: linear-gradient(90deg, transparent, #f97316, transparent);
    opacity: 0.4;
    animation: lineFlicker 2s steps(1) infinite;
  }

  .char-name::before { right: calc(100% + 16px); }
  .char-name::after  { left: calc(100% + 16px); }

  @keyframes lineFlicker {
    0%, 100% { opacity: 0.4; }
    30% { opacity: 0.1; }
    31% { opacity: 0.5; }
    60% { opacity: 0.3; }
    61% { opacity: 0.6; }
    62% { opacity: 0.35; }
  }

  .char-real-name {
    font-weight: 600;
    font-size: clamp(16px, 4vw, 28px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    margin-top: 8px;
  }

  .glitch-bars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .gb {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(249,115,22,0.6);
    box-shadow: 0 0 10px rgba(249,115,22,0.4);
  }

  .gb:nth-child(1) { height: 2px; top: 18%; animation: glitchBar 0.12s steps(2) infinite; }
  .gb:nth-child(2) { height: 3px; top: 33%; animation: glitchBar 0.15s steps(2) 0.04s infinite; }
  .gb:nth-child(3) { height: 2px; top: 47%; animation: glitchBar 0.1s steps(2) 0.08s infinite; }
  .gb:nth-child(4) { height: 4px; top: 58%; animation: glitchBar 0.18s steps(2) 0.02s infinite; }
  .gb:nth-child(5) { height: 2px; top: 72%; animation: glitchBar 0.13s steps(2) 0.06s infinite; }
  .gb:nth-child(6) { height: 1px; top: 85%; animation: glitchBar 0.11s steps(2) 0.1s infinite; }
  .gb:nth-child(7) { height: 2px; top: 26%; animation: glitchBar 0.14s steps(2) 0.03s infinite; }
  .gb:nth-child(8) { height: 3px; top: 65%; animation: glitchBar 0.16s steps(2) 0.07s infinite; }

  @keyframes glitchBar {
    0%   { opacity: 0; transform: translateX(-8px) scaleX(0.6); }
    50%  { opacity: 1; transform: translateX(4px) scaleX(1); }
    100% { opacity: 0; transform: translateX(0) scaleX(0.8); }
  }

  .tear {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    animation: tearVis 4s steps(1) infinite;
  }

  .tear-slice {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(249,115,22,0.04);
    border-top: 1px solid rgba(249,115,22,0.15);
    border-bottom: 1px solid rgba(249,115,22,0.15);
  }

  .tear-slice:nth-child(1) { top: 0; height: 30%; animation: tearShift 4s steps(1) infinite; }
  .tear-slice:nth-child(2) { top: 32%; height: 25%; animation: tearShift2 4s steps(1) infinite; }
  .tear-slice:nth-child(3) { top: 59%; height: 20%; animation: tearShift 4s steps(1) 0.05s infinite; }
  .tear-slice:nth-child(4) { top: 81%; height: 19%; animation: tearShift2 4s steps(1) 0.03s infinite; }

  @keyframes tearShift {
    0%, 95%, 100% { transform: translateX(0); }
    96% { transform: translateX(12px); }
    97% { transform: translateX(-8px); }
    98% { transform: translateX(5px); }
    99% { transform: translateX(0); }
  }

  @keyframes tearShift2 {
    0%, 93%, 100% { transform: translateX(0); }
    94% { transform: translateX(-10px); }
    95% { transform: translateX(7px); }
    96% { transform: translateX(-4px); }
    97% { transform: translateX(0); }
  }

  .tear { animation: tearVis 4s steps(1) infinite; }

  @keyframes tearVis {
    0%, 93%, 100% { opacity: 0; }
    94% { opacity: 1; }
    99% { opacity: 0; }
  }

  /* ===== SKIP ICONS — HIGH CONTRAST ===== */
  .skip-fragments {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .frag {
    position: absolute;
    background: rgba(249,115,22,0.12);
    border: 2px solid #f97316;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 12px rgba(249,115,22,0.5),
      0 0 30px rgba(249,115,22,0.2),
      inset 0 0 10px rgba(249,115,22,0.08);
  }

  .frag svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: #f97316;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(249,115,22,0.8));
  }

  .frag:nth-child(1) { width: 38px; height: 38px; top: 10%; left: 7%;  animation: fragJump 2.1s steps(1) infinite; }
  .frag:nth-child(2) { width: 34px; height: 34px; top: 24%; right: 11%; animation: fragJump 1.8s steps(1) 0.3s infinite; }
  .frag:nth-child(3) { width: 42px; height: 42px; bottom: 18%; left: 13%; animation: fragJump 2.4s steps(1) 0.6s infinite; }
  .frag:nth-child(4) { width: 30px; height: 30px; bottom: 28%; right: 9%;  animation: fragJump 1.6s steps(1) 0.9s infinite; }
  .frag:nth-child(5) { width: 36px; height: 36px; top: 52%; left: 4%;  animation: fragJump 2.0s steps(1) 0.2s infinite; }
  .frag:nth-child(6) { width: 32px; height: 32px; top: 38%; right: 6%;  animation: fragJump 2.2s steps(1) 0.5s infinite; }

  @keyframes fragJump {
    0%   { opacity: 0.8; transform: translate(0, 0) rotate(0deg); }
    20%  { opacity: 0; transform: translate(18px, -12px) rotate(6deg); }
    21%  { opacity: 0.9; transform: translate(-14px, 10px) rotate(-4deg); }
    50%  { opacity: 0; transform: translate(10px, 14px) rotate(5deg); }
    51%  { opacity: 0.7; transform: translate(-8px, -16px) rotate(-3deg); }
    80%  { opacity: 0; transform: translate(12px, 8px) rotate(4deg); }
    81%  { opacity: 0.8; transform: translate(0, 0) rotate(0deg); }
    100% { opacity: 0.8; transform: translate(0, 0) rotate(0deg); }
  }

  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  .vol {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 5;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f97316;
    box-shadow: 0 0 10px rgba(249,115,22,0.7);
    animation: dotBlink 1.5s steps(1) infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 0.5; }
    40% { opacity: 1; }
    41% { opacity: 0.3; }
    42% { opacity: 0.9; }
  }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(249,115,22,0.45);
  }

  @media (max-width: 400px) {
    .char-name { letter-spacing: 2px; }
    .the-word { letter-spacing: 8px; }
    .char-real-name { letter-spacing: 4px; }
    .theme-label { letter-spacing: 5px; }
    .char-name::before, .char-name::after { display: none; }
    .frag { width: 28px !important; height: 28px !important; }
    .frag svg { width: 13px; height: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="glitch-bars">
  <div class="gb"></div><div class="gb"></div><div class="gb"></div>
  <div class="gb"></div><div class="gb"></div><div class="gb"></div>
  <div class="gb"></div><div class="gb"></div>
</div>

<div class="tear">
  <div class="tear-slice"></div>
  <div class="tear-slice"></div>
  <div class="tear-slice"></div>
  <div class="tear-slice"></div>
</div>

<div class="skip-fragments">
  <div class="frag"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
  <div class="frag"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
  <div class="frag"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
  <div class="frag"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
  <div class="frag"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
  <div class="frag"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
</div>

<div class="title-block">
  <div class="theme-label">Pattern Recognition</div>
  <div class="the-word">The</div>
  <div class="char-name">Skipper</div>
  <div class="char-real-name">Devin</div>
</div>

<div class="vol">
  <div class="vol-dot"></div>
  <div class="vol-text">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const oranges = [
  [249, 115, 22],
  [251, 146, 60],
  [234, 88, 12],
  [253, 186, 116],
  [220, 80, 10],
  [245, 130, 40]
];

const NUM = 110;
const dots = [];

for (let i = 0; i < NUM; i++) {
  const c = oranges[Math.floor(Math.random() * oranges.length)];
  dots.push({
    x: Math.random() * W,
    y: Math.random() * H,
    ox: 0, oy: 0,
    r: 1 + Math.random() * 2.2,
    seed: Math.random() * 1000,
    alpha: 0.5 + Math.random() * 0.5,
    c: c,
    jumpTimer: Math.random() * 40,
    jumpInterval: 3 + Math.random() * 20,
    visible: true,
    flickerTimer: Math.random() * 10
  });
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);

  for (const d of dots) {
    d.jumpTimer -= 1;
    d.flickerTimer -= 1;

    if (d.jumpTimer <= 0) {
      d.ox = d.x;
      d.oy = d.y;
      d.x = Math.random() * W;
      d.y = Math.random() * H;
      d.jumpTimer = d.jumpInterval;
      d.visible = Math.random() > 0.15;
    }

    if (d.flickerTimer <= 0) {
      d.visible = !d.visible;
      d.flickerTimer = 2 + Math.random() * 15;
    }

    if (!d.visible) continue;

    const [r, g, b] = d.c;
    const fa = d.alpha * (0.6 + Math.random() * 0.4);

    ctx.save();
    ctx.globalAlpha = fa * 0.15;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(d.ox, d.oy, d.r * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.2)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa * 0.35;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 26;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 2.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.1)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = fa * 0.7;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.restore();
  }

  ctx.lineWidth = 0.7;
  for (let i = 0; i < dots.length; i++) {
    if (!dots[i].visible) continue;
    for (let j = i + 1; j < dots.length; j++) {
      if (!dots[j].visible) continue;
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 3600) {
        const a = (1 - Math.sqrt(d2) / 60) * 0.3;
        ctx.strokeStyle = `rgba(249,115,22,${a})`;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
