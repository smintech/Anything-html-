<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Skipper — Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  /* ===== INTRO ===== */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
  }

  .intro.show { animation: introShow 5s ease-in-out forwards; }

  @keyframes introShow {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .intro-label {
    font-weight: 700;
    font-size: clamp(10px, 2.2vw, 14px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(249,115,22,0.5);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeDown 5s ease-in-out forwards;
  }

  @keyframes fadeDown {
    0%, 8%   { opacity: 0; transform: translateY(-15px); }
    14%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-10px); }
  }

  .intro-title {
    font-weight: 900;
    font-size: clamp(48px, 14vw, 160px);
    line-height: 0.9;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px rgba(249,115,22,0.4), 0 0 80px rgba(249,115,22,0.15);
    opacity: 0;
    animation: titleIn 5s ease-in-out forwards;
  }

  @keyframes titleIn {
    0%, 10%  { opacity: 0; transform: scaleX(0.85); letter-spacing: 12px; }
    18%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    82%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    100%     { opacity: 0; transform: scaleX(1.02); letter-spacing: 4px; }
  }

  .intro-line-wrap {
    width: clamp(200px, 50vw, 500px);
    height: 2px;
    margin: 18px 0;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: lineIn 5s ease-in-out forwards;
  }

  @keyframes lineIn {
    0%, 18%  { opacity: 0; }
    24%      { opacity: 1; }
    82%      { opacity: 1; }
    100%     { opacity: 0; }
  }

  .intro-line-bg { position: absolute; inset: 0; background: rgba(255,255,255,0.06); }

  .intro-line-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #f97316, #fb923c, #f97316);
    box-shadow: 0 0 12px rgba(249,115,22,0.5);
    animation: lineGrow 5s ease-in-out forwards;
  }

  @keyframes lineGrow {
    0%, 18%  { width: 0; }
    30%      { width: 100%; }
    82%      { width: 100%; }
    100%     { width: 0; }
  }

  .intro-sub {
    font-weight: 400;
    font-size: clamp(14px, 3.5vw, 22px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    opacity: 0;
    animation: fadeUp 5s ease-in-out forwards;
  }

  @keyframes fadeUp {
    0%, 22%  { opacity: 0; transform: translateY(12px); }
    30%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-8px); }
  }

  /* ===== SUBTEXT ===== */
  .subtext-stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .subtext-stage.active { opacity: 1; }

  .sub-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 24px 36px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
    animation: subIn 5s ease-in-out forwards;
  }

  @keyframes subIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.95); }
    10%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-8px) scale(0.98); }
  }

  .sub-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    bottom: 15%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 30px var(--accent-glow);
  }

  .sub-card::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-glow), transparent 50%, var(--accent-glow));
    z-index: -1;
    opacity: 0.4;
    animation: cardGlow 2s ease-in-out infinite;
  }

  @keyframes cardGlow {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.6; }
  }

  .sub-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent-bg);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .sub-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sub-text {
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    letter-spacing: 0.3px;
  }

  .sub-text .dim { color: rgba(255,255,255,0.4); font-weight: 400; }

  /* ===== GLITCH BARS (background texture) ===== */
  .glitch-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .gbar {
    position: absolute;
    left: 0; right: 0;
    background: rgba(249,115,22,0.25);
  }

  .gbar:nth-child(1) { height: 1px; top: 20%; animation: gbflick 0.15s steps(2) infinite; }
  .gbar:nth-child(2) { height: 1px; top: 45%; animation: gbflick 0.12s steps(2) 0.05s infinite; }
  .gbar:nth-child(3) { height: 1px; top: 70%; animation: gbflick 0.18s steps(2) 0.03s infinite; }
  .gbar:nth-child(4) { height: 1px; top: 88%; animation: gbflick 0.1s steps(2) 0.08s infinite; }

  @keyframes gbflick {
    0%   { opacity: 0; transform: translateX(-5px); }
    50%  { opacity: 0.5; transform: translateX(3px); }
    100% { opacity: 0; transform: translateX(0); }
  }

  /* ===== STAMP ===== */
  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  /* ===== VOL ===== */
  .vol-badge {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f97316;
    box-shadow: 0 0 10px rgba(249,115,22,0.7);
    animation: vdb 1.5s steps(1) infinite;
  }

  @keyframes vdb {
    0%, 100% { opacity: 0.5; }
    40% { opacity: 1; }
    41% { opacity: 0.3; }
    42% { opacity: 0.9; }
  }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(249,115,22,0.45);
  }

  @media (max-width: 400px) {
    .sub-card { padding: 18px 24px; gap: 14px; }
    .sub-icon { width: 36px; height: 36px; }
    .sub-icon svg { width: 17px; height: 17px; }
    .intro-title { letter-spacing: 0; }
    .intro-sub { letter-spacing: 3px; }
    .intro-label { letter-spacing: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="glitch-bg">
  <div class="gbar"></div><div class="gbar"></div><div class="gbar"></div><div class="gbar"></div>
</div>

<!-- ============================================= -->
<!--  INTRO — EDIT THESE FOUR                     -->
<!-- ============================================= -->
<div class="intro" id="intro">
  <div class="intro-label" id="iLabel">Pattern Recognition</div>
  <div class="intro-title" id="iTitle">The Skipper</div>
  <div class="intro-line-wrap">
    <div class="intro-line-bg"></div>
    <div class="intro-line-fill"></div>
  </div>
  <div class="intro-sub" id="iSub">Devin</div>
</div>
<!-- ============================================= -->

<div class="subtext-stage" id="subStage"></div>

<div class="vol-badge">
  <div class="vol-dot"></div>
  <div class="vol-text" id="volText">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
/* ============================================= */
/*  INTRO CONFIG                                 */
/* ============================================= */
const INTRO = {
  label: "Pattern Recognition",
  title: "The Skipper",
  sub: "Devin",
  vol: "Vol.2",
  duration: 5000
};

/* ============================================= */
/*  SUBTEXT CONFIG — EDIT THIS LIST               */
/* ============================================= */
const SUBTEXTS = [
  {
    icon: '<polygon points="5 3 19 12 5 21 5 3"/>',
    text: 'Twenty seconds in, <span class="dim">his hand reaches for skip</span>',
    color: '#f97316'
  },
  {
    icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    text: 'A four-minute song feels like <span class="dim">a hostage situation</span>',
    color: '#ef4444'
  },
  {
    icon: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    text: 'Not because it\'s boring. <span class="dim">Because it\'s too slow</span>',
    color: '#eab308'
  },
  {
    icon: '<rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
    text: 'His prediction engine <span class="dim">is overworked</span>',
    color: '#06b6d4'
  },
  {
    icon: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
    text: 'It learned to resolve patterns <span class="dim">in seconds</span>',
    color: '#f97316'
  }
];

const SUB_DURATION = 5000;
/* ============================================= */


document.getElementById('iLabel').textContent = INTRO.label;
document.getElementById('iTitle').textContent = INTRO.title;
document.getElementById('iSub').textContent = INTRO.sub;
document.getElementById('volText').textContent = INTRO.vol;

const subStage = document.getElementById('subStage');

function showSubtext(index) {
  subStage.innerHTML = '';
  subStage.classList.remove('active');

  if (index >= SUBTEXTS.length) {
    startIntro();
    return;
  }

  const item = SUBTEXTS[index];
  const c = item.color;

  const card = document.createElement('div');
  card.className = 'sub-card';
  card.style.setProperty('--accent', c);
  card.style.setProperty('--accent-glow', c + '40');
  card.style.setProperty('--accent-bg', c + '18');

  card.innerHTML = `
    <div class="sub-icon">
      <svg viewBox="0 0 24 24">${item.icon}</svg>
    </div>
    <div class="sub-text">${item.text}</div>
  `;

  subStage.appendChild(card);
  requestAnimationFrame(() => subStage.classList.add('active'));
  setTimeout(() => showSubtext(index + 1), SUB_DURATION);
}

const introEl = document.getElementById('intro');

function startIntro() {
  introEl.classList.remove('show');
  introEl.style.opacity = '0';
  requestAnimationFrame(() => introEl.classList.add('show'));
  setTimeout(() => {
    introEl.classList.remove('show');
    introEl.style.opacity = '0';
    setTimeout(() => showSubtext(0), 400);
  }, INTRO.duration);
}

startIntro();


/* ===== BACKGROUND — jittery orange particles ===== */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const oranges = [
  [249, 115, 22],
  [251, 146, 60],
  [234, 88, 12],
  [253, 186, 116],
  [220, 80, 10]
];

const NUM = 70;
const dots = [];

for (let i = 0; i < NUM; i++) {
  const c = oranges[Math.floor(Math.random() * oranges.length)];
  dots.push({
    x: Math.random() * W,
    y: Math.random() * H,
    ox: 0, oy: 0,
    r: 0.8 + Math.random() * 1.5,
    seed: Math.random() * 1000,
    c: c,
    jumpTimer: Math.random() * 30,
    jumpInterval: 4 + Math.random() * 18,
    visible: true,
    flickerTimer: Math.random() * 12
  });
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);

  for (const d of dots) {
    d.jumpTimer -= 1;
    d.flickerTimer -= 1;

    if (d.jumpTimer <= 0) {
      d.ox = d.x;
      d.oy = d.y;
      d.x = Math.random() * W;
      d.y = Math.random() * H;
      d.jumpTimer = d.jumpInterval;
      d.visible = Math.random() > 0.12;
    }

    if (d.flickerTimer <= 0) {
      d.visible = !d.visible;
      d.flickerTimer = 3 + Math.random() * 12;
    }

    if (!d.visible) continue;

    const [r, g, b] = d.c;
    const fa = (0.5 + Math.random() * 0.5);

    /* Ghost */
    ctx.save();
    ctx.globalAlpha = fa * 0.12;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(d.ox, d.oy, d.r * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.15)`;
    ctx.fill();
    ctx.restore();

    /* Glow */
    ctx.save();
    ctx.globalAlpha = fa * 0.3;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.1)`;
    ctx.fill();
    ctx.restore();

    /* Core */
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    /* Center */
    ctx.save();
    ctx.globalAlpha = fa * 0.6;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
