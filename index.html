
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts of a Clock & Quarters - Classroom Reference Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap');

        :root {
            --blue-hour: #0056b3;
            --red-minute: #bd0000;
            --teal-quarters: #0d9488;
            --clock-face-bg: #f8fafc;
            --text-dark: #0f172a;
            --label-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-dark);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- HEADER (EXTRA LARGE) --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            color: #1e293b;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-weight: 900;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: clamp(1rem, 2vw, 1.4rem);
        }

        /* --- POSTER CONTAINER --- */
        .poster-container {
            width: 100%;
            max-width: 1250px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 6px solid white;
        }

        /* --- DIAGRAM AREA --- */
        .diagram-area {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 1.35;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-canvas {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- HIGH CONTRAST LABELS --- */
        .diagram-label {
            background: var(--label-bg);
            border: 5px solid #64748b;
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            font-size: 1.15rem;
            font-weight: 900;
            line-height: 1.3;
            max-width: 260px;
            text-align: center;
        }

        .diagram-label strong {
            font-family: 'Fredoka', sans-serif;
            display: block;
            font-size: 1.45rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        /* --- GOLDEN RULES (MAXIMUM SIZE BANNER) --- */
        .takeaway-banner {
            width: 100%;
            background: #fef08a; /* Bright Yellow */
            border: 5px dashed #ca8a04;
            color: #451a03;
            padding: 24px;
            border-radius: 30px;
            text-align: center;
            font-size: clamp(1.2rem, 3.2vw, 1.8rem);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(202, 138, 4, 0.1);
        }

        .takeaway-rule {
            font-family: 'Fredoka', sans-serif;
        }

        .quarter-tag {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            fill: var(--teal-quarters);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Parts of a Clock</h1>
        <div class="subtitle">Primary 1 Mathematics Reference Poster</div>
    </header>

    <main class="poster-container">
        
        <!-- LARGE HIGH-CONTRAST SVG DIAGRAM -->
        <div class="diagram-area">
            <svg class="svg-canvas" viewBox="0 0 1200 900">
                <!-- Marker Definitions for Arrowheads -->
                <defs>
                    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
                    </marker>
                    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue-hour)" />
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--red-minute)" />
                    </marker>
                    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--teal-quarters)" />
                    </marker>
                </defs>

                <!-- Clock Back Shadow -->
                <circle cx="600" cy="454" r="240" fill="rgba(0,0,0,0.04)" />
                
                <!-- MAIN CLOCK FACE -->
                <circle cx="600" cy="450" r="240" fill="var(--clock-face-bg)" stroke="#1e293b" stroke-width="12" />
                <circle cx="600" cy="450" r="218" fill="white" />

                <!-- VISUAL QUARTER SECTIONS (Pizza Slices) -->
                <!-- Dashed helper lines directly dividing the clock into 4 equal quarters -->
                <line x1="600" y1="232" x2="600" y2="668" stroke="var(--teal-quarters)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
                <line x1="382" y1="450" x2="818" y2="450" stroke="var(--teal-quarters)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />

                <!-- NUMBERS 1-12 (QUARTERS & NUMBERS HIGH CONTRAST) -->
                <g>
                    <!-- Quarter Markers (Teal & Mega-Sized) -->
                    <text x="600" y="295" text-anchor="middle" font-family="Fredoka" font-size="56" font-weight="bold" fill="var(--teal-quarters)">12</text>
                    <text x="770" y="468" text-anchor="middle" font-family="Fredoka" font-size="56" font-weight="bold" fill="var(--teal-quarters)">3</text>
                    <text x="600" y="640" text-anchor="middle" font-family="Fredoka" font-size="56" font-weight="bold" fill="var(--teal-quarters)">6</text>
                    <text x="430" y="468" text-anchor="middle" font-family="Fredoka" font-size="56" font-weight="bold" fill="var(--teal-quarters)">9</text>
                    
                    <!-- Other Main Numbers (Super Bold Slate Gray) -->
                    <text x="685" y="325" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">1</text>
                    <text x="745" y="385" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">2</text>
                    <text x="745" y="535" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">4</text>
                    <text x="685" y="595" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">5</text>
                    <text x="515" y="595" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">7</text>
                    <text x="455" y="535" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">8</text>
                    <text x="455" y="385" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">10</text>
                    <text x="515" y="325" text-anchor="middle" font-family="Fredoka" font-size="38" font-weight="bold" fill="#475569">11</text>

                    <!-- Text indicators directly near numbers -->
                    <text x="600" y="238" text-anchor="middle" class="quarter-tag">O'Clock</text>
                    <text x="770" y="510" text-anchor="middle" class="quarter-tag">Quarter Past</text>
                    <text x="600" y="675" text-anchor="middle" class="quarter-tag">Half Past</text>
                    <text x="430" y="510" text-anchor="middle" class="quarter-tag">Quarter To</text>
                </g>

                <!-- HOUR HAND (Short, Very Thick Blue - Pointing to 3) -->
                <line x1="600" y1="450" x2="710" y2="450" stroke="var(--blue-hour)" stroke-width="24" stroke-linecap="round" />

                <!-- MINUTE HAND (Long, Thick Red - Pointing to 12) -->
                <line x1="600" y1="450" x2="600" y2="310" stroke="var(--red-minute)" stroke-width="12" stroke-linecap="round" />

                <!-- CENTER POINT (Large Pin) -->
                <circle cx="600" cy="450" r="14" fill="var(--red-minute)" stroke="white" stroke-width="4" />

                <!-- EXTRA THICK DOTTED POINTER LINES & ARROWS -->
                <g>
                    <!-- To Clock Face -->
                    <path d="M 310 140 Q 360 120, 440 210" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Numbers -->
                    <path d="M 310 320 Q 370 310, 420 340" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Center Point -->
                    <path d="M 310 510 Q 420 540, 580 470" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-gray)" />
                    
                    <!-- To Minute Hand (Red Pointer) -->
                    <path d="M 890 220 L 620 340" stroke="var(--red-minute)" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-red)" />
                    
                    <!-- To Hour Hand (Blue Pointer) -->
                    <path d="M 890 680 L 685 470" stroke="var(--blue-hour)" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-blue)" />

                    <!-- To Quarter Markers (Teal Multi-Pointer) -->
                    <!-- Points from the Quarters Box directly to 3 and 12/6 zones -->
                    <path d="M 890 450 L 805 450" stroke="var(--teal-quarters)" stroke-width="4.5" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-teal)" />
                    <path d="M 890 420 Q 750 360, 635 285" stroke="var(--teal-quarters)" stroke-width="4" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-teal)" />
                </g>

                <!-- EMBEDDED MEGA LABEL CARDS -->
                
                <!-- 1. CLOCK FACE -->
                <foreignObject x="30" y="60" width="280" height="150">
                    <div class="diagram-label" style="border-color: #475569;">
                        <strong style="color: #334155;">CLOCK FACE</strong>
                        The big, flat circle that holds the numbers.
                    </div>
                </foreignObject>

                <!-- 2. NUMBERS 1-12 -->
                <foreignObject x="30" y="250" width="280" height="150">
                    <div class="diagram-label" style="border-color: #475569;">
                        <strong style="color: #475569;">NUMBERS 1-12</strong>
                        They help us count hours and minutes.
                    </div>
                </foreignObject>

                <!-- 3. CENTER -->
                <foreignObject x="30" y="440" width="280" height="150">
                    <div class="diagram-label" style="border-color: var(--red-minute);">
                        <strong style="color: var(--red-minute);">CENTER</strong>
                        The middle pin that holds the hands.
                    </div>
                </foreignObject>

                <!-- 4. MINUTE HAND -->
                <foreignObject x="890" y="140" width="280" height="170">
                    <div class="diagram-label" style="border-color: var(--red-minute); color: #7f1d1d;">
                        <strong style="color: var(--red-minute);">MINUTE HAND</strong>
                        The <span style="text-decoration: underline;">long, thin</span> hand. It shows the minutes!
                    </div>
                </foreignObject>

                <!-- 5. QUARTER MARKERS -->
                <foreignObject x="890" y="340" width="280" height="180">
                    <div class="diagram-label" style="border-color: var(--teal-quarters); color: #0f766e; background-color: #f0fdfa;">
                        <strong style="color: var(--teal-quarters);">QUARTERS (12, 3, 6, 9)</strong>
                        These four key numbers cut the clock into four equal parts!
                    </div>
                </foreignObject>

                <!-- 6. HOUR HAND -->
                <foreignObject x="890" y="550" width="280" height="170">
                    <div class="diagram-label" style="border-color: var(--blue-hour); color: #0c4a6e;">
                        <strong style="color: var(--blue-hour);">HOUR HAND</strong>
                        The <span style="text-decoration: underline;">short, thick</span> hand. It shows the hours!
                    </div>
                </foreignObject>
            </svg>
        </div>

        <!-- GOLDEN RULE MESSAGE (MAX SIZE & READABILITY BANNER) -->
        <div class="takeaway-banner">
            <span>📢</span>
            <span class="takeaway-rule">
                The <strong>short hand</strong> shows hours, the <strong>long hand</strong> shows minutes, and the <strong>quarters</strong> split the clock in four!
            </span>
        </div>

    </main>

</body>
</html>
