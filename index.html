<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dopamine Vol.2 — Intro + Subtexts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  #bgCanvas { position: fixed; inset: 0; z-index: 0; }

  /* ===== INTRO BLOCK ===== */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
  }

  .intro.show {
    animation: introShow 5s ease-in-out forwards;
  }

  @keyframes introShow {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .intro-label {
    font-weight: 700;
    font-size: clamp(10px, 2.2vw, 14px);
    letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(168,85,247,0.5);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeDown 5s ease-in-out forwards;
  }

  @keyframes fadeDown {
    0%, 8%   { opacity: 0; transform: translateY(-15px); }
    14%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-10px); }
  }

  .intro-title {
    font-weight: 900;
    font-size: clamp(48px, 14vw, 160px);
    line-height: 0.9;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px rgba(168,85,247,0.4), 0 0 80px rgba(168,85,247,0.15);
    opacity: 0;
    animation: titleIn 5s ease-in-out forwards;
  }

  @keyframes titleIn {
    0%, 10%  { opacity: 0; transform: scaleX(0.85); letter-spacing: 12px; }
    18%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    82%      { opacity: 1; transform: scaleX(1); letter-spacing: 2px; }
    100%     { opacity: 0; transform: scaleX(1.02); letter-spacing: 4px; }
  }

  .intro-line-wrap {
    width: clamp(200px, 50vw, 500px);
    height: 2px;
    margin: 18px 0;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: lineIn 5s ease-in-out forwards;
  }

  @keyframes lineIn {
    0%, 18%  { opacity: 0; }
    24%      { opacity: 1; }
    82%      { opacity: 1; }
    100%     { opacity: 0; }
  }

  .intro-line-bg {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.06);
  }

  .intro-line-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #a855f7, #c084fc, #a855f7);
    box-shadow: 0 0 12px rgba(168,85,247,0.5);
    animation: lineGrow 5s ease-in-out forwards;
  }

  @keyframes lineGrow {
    0%, 18%  { width: 0; }
    30%      { width: 100%; }
    82%      { width: 100%; }
    100%     { width: 0; }
  }

  .intro-sub {
    font-weight: 400;
    font-size: clamp(14px, 3.5vw, 22px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    opacity: 0;
    animation: fadeUp 5s ease-in-out forwards;
  }

  @keyframes fadeUp {
    0%, 22%  { opacity: 0; transform: translateY(12px); }
    30%      { opacity: 1; transform: translateY(0); }
    82%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(-8px); }
  }

  /* ===== SUBTEXT BLOCK ===== */
  .subtext-stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .subtext-stage.active { opacity: 1; }

  .sub-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 24px 36px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
    animation: subIn 5s ease-in-out forwards;
  }

  @keyframes subIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.95); }
    10%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-8px) scale(0.98); }
  }

  /* Color accent bar on left */
  .sub-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    bottom: 15%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 30px var(--accent-glow);
  }

  /* Glow behind card */
  .sub-card::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-glow), transparent 50%, var(--accent-glow));
    z-index: -1;
    opacity: 0.4;
    animation: cardGlow 2s ease-in-out infinite;
  }

  @keyframes cardGlow {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.6; }
  }

  .sub-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent-bg);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .sub-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sub-text {
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    letter-spacing: 0.3px;
  }

  .sub-text .dim {
    color: rgba(255,255,255,0.4);
    font-weight: 400;
  }

  /* ===== CORNER STAMP ===== */
  .stamp {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    text-align: right;
  }

  .stamp-text {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    line-height: 1.7;
  }

  /* ===== VOL BADGE ===== */
  .vol-badge {
    position: fixed;
    top: 22px;
    left: 24px;
    z-index: 12;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a855f7;
    box-shadow: 0 0 10px rgba(168,85,247,0.7);
    animation: dotBlink 2s ease-in-out infinite;
  }

  @keyframes dotBlink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .vol-text {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(168,85,247,0.45);
  }

  @media (max-width: 400px) {
    .sub-card { padding: 18px 24px; gap: 14px; }
    .sub-icon { width: 36px; height: 36px; }
    .sub-icon svg { width: 17px; height: 17px; }
    .intro-title { letter-spacing: 0; }
    .intro-sub { letter-spacing: 3px; }
    .intro-label { letter-spacing: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- ============================================= -->
<!--  INTRO — EDIT THESE FOUR                     -->
<!-- ============================================= -->
<div class="intro" id="intro">
  <div class="intro-label" id="iLabel">Pattern Recognition</div>
  <div class="intro-title" id="iTitle">Dopamine</div>
  <div class="intro-line-wrap">
    <div class="intro-line-bg"></div>
    <div class="intro-line-fill"></div>
  </div>
  <div class="intro-sub" id="iSub">Vol. 2</div>
</div>
<!-- ============================================= -->

<!-- SUBTEXT CONTAINER — auto generated -->
<div class="subtext-stage" id="subStage"></div>

<div class="vol-badge">
  <div class="vol-dot"></div>
  <div class="vol-text" id="volText">Vol.2</div>
</div>

<div class="stamp">
  <div class="stamp-text">You Do<br>This Too</div>
</div>

<script>
/* ============================================= */
/*  INTRO CONFIG — EDIT THESE                     */
/* ============================================= */
const INTRO = {
  label: "Pattern Recognition",
  title: "Dopamine",
  sub: "Vol. 2",
  vol: "Vol.2",
  duration: 5000
};

/* ============================================= */
/*  SUBTEXT CONFIG — EDIT THIS LIST               */
/*                                             */
/*  icon: SVG path (feather icon style)           */
/*  text: HTML string — use <span class="dim">    */
/*        for lighter words                       */
/*  color: accent color for the card              */
/* ============================================= */
const SUBTEXTS = [
  {
    icon: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
    text: 'You know someone who always finishes your sentences?<span class="dim">This is why.</span>',
    color: '#10b981'
  },
  {
    icon: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    text: 'She skips every song to the hook.<span class="dim">Not because she doesn"t like the rest. </span>',
    color: '#06b6d4'
  },
  {
    icon: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    text: 'The beat drop feels good because <span class="dim">you called it</span>',
    color: '#f43f5e'
  },
  {
    icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    text: 'Being right feels like relief. <span class="dim">And some people are addicted to it.</span>',
    color: '#a855f7'
  }
];

const SUB_DURATION = 5000;
/* ============================================= */


/* Apply intro text */
document.getElementById('iLabel').textContent = INTRO.label;
document.getElementById('iTitle').textContent = INTRO.title;
document.getElementById('iSub').textContent = INTRO.sub;
document.getElementById('volText').textContent = INTRO.vol;

/* ===== SUBTEXT ENGINE ===== */
const subStage = document.getElementById('subStage');
let currentSub = -1;

function showSubtext(index) {
  /* Remove old */
  subStage.innerHTML = '';
  subStage.classList.remove('active');

  if (index >= SUBTEXTS.length) {
    /* All done — restart intro */
    currentSub = -1;
    startIntro();
    return;
  }

  const item = SUBTEXTS[index];
  const c = item.color;

  /* Build card with CSS vars for color */
  const card = document.createElement('div');
  card.className = 'sub-card';
  card.style.setProperty('--accent', c);
  card.style.setProperty('--accent-glow', c + '40');
  card.style.setProperty('--accent-bg', c + '18');

  card.innerHTML = `
    <div class="sub-icon">
      <svg viewBox="0 0 24 24">${item.icon}</svg>
    </div>
    <div class="sub-text">${item.text}</div>
  `;

  subStage.appendChild(card);

  /* Trigger animation */
  requestAnimationFrame(() => {
    subStage.classList.add('active');
  });

  /* Queue next */
  setTimeout(() => showSubtext(index + 1), SUB_DURATION);
}

/* ===== INTRO ENGINE ===== */
const introEl = document.getElementById('intro');

function startIntro() {
  introEl.classList.remove('show');
  introEl.style.opacity = '0';

  requestAnimationFrame(() => {
    introEl.classList.add('show');
  });

  setTimeout(() => {
    introEl.classList.remove('show');
    introEl.style.opacity = '0';
    /* Start subtexts after intro fades */
    setTimeout(() => showSubtext(0), 400);
  }, INTRO.duration);
}

/* Kick off */
startIntro();


/* ===== BACKGROUND PARTICLES ===== */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM = 80;
const dots = [];

const palette = [
  [168, 85, 247],
  [192, 132, 252],
  [16, 185, 129],
  [6, 182, 212],
  [244, 63, 94],
  [245, 158, 11]
];

for (let i = 0; i < NUM; i++) {
  const c = palette[Math.floor(Math.random() * palette.length)];
  dots.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    r: 0.8 + Math.random() * 1.5,
    seed: Math.random() * 1000,
    c: c
  });
}

function loop(time) {
  ctx.clearRect(0, 0, W, H);
  const t = time * 0.001;

  /* Connections */
  ctx.lineWidth = 0.6;
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 8000) {
        const a = (1 - Math.sqrt(d2) / 90) * 0.2;
        const [r, g, b] = dots[i].c;
        ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.stroke();
      }
    }
  }

  /* Dots */
  for (const d of dots) {
    d.x += d.vx;
    d.y += d.vy;
    if (d.x < -10 || d.x > W + 10) d.vx *= -1;
    if (d.y < -10 || d.y > H + 10) d.vy *= -1;

    const [r, g, b] = d.c;
    const pulse = 0.6 + Math.sin(t * 2 + d.seed) * 0.4;

    ctx.save();
    ctx.globalAlpha = pulse * 0.3;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.1)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = pulse * 0.7;
    ctx.shadowColor = `rgba(${r},${g},${b},1)`;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = pulse * 0.5;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
