<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Character CTA Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#04060b;
    --bg1:#07111c;
    --bg2:#0a1721;
    --card:rgba(10,12,18,.72);
    --card2:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.10);
    --text:#ffffff;
    --muted:rgba(255,255,255,.62);
    --muted2:rgba(255,255,255,.42);
    --accent:#10b981;
    --accent2:#38bdf8;
    --accent3:#8b5cf6;
    --accent4:#f59e0b;
    --shadow: 0 18px 50px rgba(0,0,0,.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Outfit', sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 15%, rgba(16,185,129,.12), transparent 22%),
      radial-gradient(circle at 80% 18%, rgba(56,189,248,.10), transparent 24%),
      radial-gradient(circle at 50% 88%, rgba(139,92,246,.10), transparent 20%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 48%, var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 18%, rgba(0,0,0,.16) 58%, rgba(0,0,0,.46) 100%);
  }

  .frame {
    position: relative;
    z-index: 2;
    width: min(960px, calc(100vw - 32px));
    height: min(620px, calc(100vh - 28px));
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 16px;
  }

  .stage {
    position: relative;
    min-height: 0;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 32px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
      rgba(0,0,0,.30);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }

  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(16,185,129,.08), transparent 30%),
      linear-gradient(315deg, rgba(56,189,248,.06), transparent 40%),
      radial-gradient(circle at 50% 10%, rgba(255,255,255,.04), transparent 28%);
    pointer-events: none;
  }

  .watermark {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transform: rotate(-3deg);
    z-index: 1;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 30px rgba(16,185,129,.10));
  }

  .wm-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .04em;
    text-transform: uppercase;
    letter-spacing: .08em;
    line-height: .92;
    font-weight: 900;
    text-align: center;
    font-size: clamp(54px, 12vw, 154px);
  }

  .wm-line {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .wm-line span {
    display: inline-block;
    color: rgba(255,255,255,.015);
    -webkit-text-stroke: 2.6px rgba(255,255,255,.18);
    animation: letterFloat 3s ease-in-out infinite;
  }

  .wm-line:nth-child(1) span:nth-child(1){animation-delay:0s}
  .wm-line:nth-child(1) span:nth-child(2){animation-delay:.06s}
  .wm-line:nth-child(1) span:nth-child(3){animation-delay:.12s}
  .wm-line:nth-child(1) span:nth-child(4){animation-delay:.18s}
  .wm-line:nth-child(1) span:nth-child(5){animation-delay:.24s}
  .wm-line:nth-child(1) span:nth-child(6){animation-delay:.30s}
  .wm-line:nth-child(2) span:nth-child(1){animation-delay:.08s}
  .wm-line:nth-child(2) span:nth-child(2){animation-delay:.14s}
  .wm-line:nth-child(2) span:nth-child(3){animation-delay:.20s}
  .wm-line:nth-child(2) span:nth-child(4){animation-delay:.26s}
  .wm-line:nth-child(2) span:nth-child(5){animation-delay:.32s}
  .wm-line:nth-child(2) span:nth-child(6){animation-delay:.38s}
  .wm-line:nth-child(2) span:nth-child(7){animation-delay:.44s}
  .wm-line:nth-child(2) span:nth-child(8){animation-delay:.50s}

  @keyframes letterFloat {
    0%,100% {
      transform: translateY(0) scale(1);
      -webkit-text-stroke-color: rgba(255,255,255,.18);
      filter: drop-shadow(0 0 0 transparent);
    }
    25% {
      transform: translateY(-10px) scale(1.05);
      -webkit-text-stroke-color: rgba(16,185,129,.48);
      filter: drop-shadow(0 0 14px rgba(16,185,129,.22));
    }
    50% {
      transform: translateY(2px) scale(1);
      -webkit-text-stroke-color: rgba(255,255,255,.22);
      filter: drop-shadow(0 0 0 transparent);
    }
    75% {
      transform: translateY(-5px) scale(1.02);
      -webkit-text-stroke-color: rgba(56,189,248,.38);
      filter: drop-shadow(0 0 10px rgba(56,189,248,.16));
    }
  }

  .watermark::before {
    content: '';
    position: absolute;
    width: min(76vw, 920px);
    height: min(26vw, 280px);
    border-radius: 999px;
    background: radial-gradient(circle, rgba(16,185,129,.08), rgba(56,189,248,.05), transparent 72%);
    filter: blur(24px);
    z-index: -1;
  }

  .watermark::after {
    content: '';
    position: absolute;
    top: -8%;
    left: -20%;
    width: 36%;
    height: 116%;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,.14), transparent);
    transform: skewX(-15deg);
    animation: scan 4s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  @keyframes scan {
    0% { left: -42%; }
    100% { left: 142%; }
  }

  .cta-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: ctaIn 4.8s ease-in-out infinite;
  }

  @keyframes ctaIn {
    0% { opacity: 0; transform: translate(-50%, -42%) scale(.94); }
    12% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -56%) scale(.97); }
  }

  .cta-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px 18px 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(11,14,20,.90), rgba(8,10,14,.72));
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 24px 60px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.03) inset;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    overflow: hidden;
    max-width: min(92vw, 820px);
  }

  .cta-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(16,185,129,.10), transparent 35%),
      linear-gradient(315deg, rgba(56,189,248,.08), transparent 42%),
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.05), transparent 18%);
    pointer-events: none;
  }

  .cta-card::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 27px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(16,185,129,.34), rgba(56,189,248,.16), rgba(139,92,246,.20));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: .72;
  }

  .icon-badge {
    width: 50px;
    height: 50px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(16,185,129,.18), rgba(16,185,129,.06));
    border: 1px solid rgba(16,185,129,.26);
    box-shadow: inset 0 0 20px rgba(16,185,129,.06), 0 0 28px rgba(16,185,129,.10);
    animation: iconPop 4.8s ease-in-out infinite;
  }

  @keyframes iconPop {
    0%,10% { transform: scale(.7) rotate(-15deg); opacity: 0; }
    16% { transform: scale(1.08) rotate(4deg); opacity: 1; }
    20% { transform: scale(1) rotate(0); }
    78% { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(.85) rotate(-6deg); opacity: 0; }
  }

  .icon-badge svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: #10b981;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .copy {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 2px;
    max-width: 100%;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.70);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    white-space: nowrap;
  }

  .chip svg {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .cta-text {
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 800;
    color: #fff;
    line-height: 1.08;
    letter-spacing: .1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cta-text .hl { color: #10b981; }
  .cta-text .soft { color: rgba(255,255,255,.72); font-weight: 700; }

  .cta-bar {
    width: 0;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #38bdf8, #8b5cf6);
    box-shadow: 0 0 18px rgba(56,189,248,.22);
    animation: barGrow 4.8s ease-in-out infinite;
  }

  @keyframes barGrow {
    0%,14% { width: 0; opacity: 0; }
    28% { width: 210px; opacity: 1; }
    72% { width: 210px; opacity: 1; }
    100% { width: 0; opacity: 0; }
  }

  .sel {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 14px;
    z-index: 4;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 12px;
    border-radius: 22px;
    background: rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    scrollbar-width: none;
  }

  .sel::-webkit-scrollbar { display: none; }

  .sel-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.56);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }

  .sel-btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,.08);
    color: #fff;
  }

  .sel-btn.on {
    background: rgba(16,185,129,.12);
    border-color: rgba(16,185,129,.30);
    color: #10b981;
    box-shadow: 0 0 0 1px rgba(16,185,129,.08) inset;
  }

  .sel-btn svg {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.74);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .hint .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #38bdf8);
    box-shadow: 0 0 14px rgba(16,185,129,.30);
  }

  @media (max-width: 560px) {
    .frame {
      width: calc(100vw - 18px);
      height: calc(100vh - 18px);
      gap: 12px;
    }

    .stage { border-radius: 24px; }
    .wm-stack { font-size: clamp(34px, 11vw, 92px); letter-spacing: .06em; }
    .wm-line span { -webkit-text-stroke: 1.8px rgba(255,255,255,.18); }
    .cta-card { padding: 14px 14px 14px 14px; gap: 10px; border-radius: 22px; }
    .icon-badge { width: 40px; height: 40px; border-radius: 14px; }
    .icon-badge svg { width: 17px; height: 17px; }
    .chip { font-size: 11px; padding: 6px 9px; }
    .cta-text { font-size: clamp(16px, 4vw, 22px); }
    .cta-bar { height: 2px; }
    .sel { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; }
    .sel-btn { font-size: 11px; padding: 7px 12px; }
    .hint { font-size: 10px; top: 12px; padding: 9px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<body>
  <canvas id="bgCanvas"></canvas>
  <div class="vignette"></div>

  <div class="frame">
    <div class="stage">
      <div class="hint"><span class="dot"></span> character CTA builder</div>

      <div class="watermark" aria-hidden="true">
        <div class="wm-stack">
          <div class="wm-line">
            <span>Y</span><span>O</span><span>U</span><span>&nbsp;</span><span>D</span><span>O</span>
          </div>
          <div class="wm-line">
            <span>T</span><span>H</span><span>I</span><span>S</span><span>&nbsp;</span><span>T</span><span>O</span><span>O</span>
          </div>
        </div>
      </div>

      <div class="cta-wrap" id="cta">
        <div class="cta-card">
          <div class="icon-badge" id="ico"></div>
          <div class="copy">
            <div class="chip-row" id="chips"></div>
            <div class="cta-text" id="txt"></div>
          </div>
        </div>
        <div class="cta-bar"></div>
      </div>

      <div class="sel" id="sel"></div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const dots = [];
  const NUM = 120;
  const LINK_DIST = 120;

  function makeDot() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.35 + Math.random() * 1.7;
    const hues = [160, 195, 250, 285];
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.1 + Math.random() * 2.5,
      hue: hues[Math.floor(Math.random() * hues.length)],
      sat: 72 + Math.random() * 20,
      light: 55 + Math.random() * 20,
      alpha: 0.42 + Math.random() * 0.48
    };
  }

  for (let i = 0; i < NUM; i++) dots.push(makeDot());

  function drawBg(t) {
    ctx.clearRect(0, 0, W, H);

    const g1 = ctx.createRadialGradient(W * 0.18, H * 0.18, 0, W * 0.18, H * 0.18, Math.max(W, H) * 0.46);
    g1.addColorStop(0, 'rgba(16,185,129,0.08)');
    g1.addColorStop(1, 'rgba(16,185,129,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const g2 = ctx.createRadialGradient(W * 0.82, H * 0.20, 0, W * 0.82, H * 0.20, Math.max(W, H) * 0.42);
    g2.addColorStop(0, 'rgba(56,189,248,0.08)');
    g2.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    // connections
    ctx.save();
    ctx.lineWidth = 0.8;
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x;
        const dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          const a = (1 - dist / LINK_DIST) * 0.28;
          const midHue = (dots[i].hue + dots[j].hue) / 2;
          ctx.strokeStyle = `hsla(${midHue},80%,60%,${a})`;
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // dots
    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      d.x = Math.max(0, Math.min(W, d.x));
      d.y = Math.max(0, Math.min(H, d.y));

      const pulse = 0.72 + Math.sin(t * 0.004 + d.x * 0.01 + d.y * 0.01) * 0.28;
      const rr = d.r * (0.9 + pulse * 0.16);

      ctx.save();
      ctx.globalAlpha = d.alpha * 0.26;
      ctx.shadowColor = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(d.x, d.y, rr * 2.8, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${d.hue},${d.sat}%,${d.light}%,0.16)`;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = d.alpha;
      ctx.shadowColor = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(d.x, d.y, rr, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = d.alpha * 0.78;
      ctx.beginPath();
      ctx.arc(d.x, d.y, rr * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(drawBg);
  }
  requestAnimationFrame(drawBg);

  const variants = [
    {
      label: 'Follow for psychology patterns',
      icon: '<path d="M12 3a7 7 0 0 0-7 7c0 3.2 2.1 5.5 5 6.6V19h4v-2.4c2.9-1.1 5-3.4 5-6.6a7 7 0 0 0-7-7z"/><path d="M9 11h6"/><path d="M10 8h2"/><path d="M12 8h2"/><path d="M15 11c0 1.7-1.3 3-3 3s-3-1.3-3-3"/>',
      chips: [
        { text: 'Psychology', icon: '<path d="M12 3a7 7 0 0 0-7 7c0 3.2 2.1 5.5 5 6.6V19h4v-2.4c2.9-1.1 5-3.4 5-6.6a7 7 0 0 0-7-7z"/>' },
        { text: 'Patterns', icon: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>' }
      ],
      html: '<span class="hl">Follow</span> for psychology patterns'
    },
    {
      label: 'Follow for patterns you missed',
      icon: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M12 9v1.5"/>',
      chips: [
        { text: 'Hidden', icon: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>' },
        { text: 'Missed', icon: '<path d="M12 5v6"/><path d="M12 15h.01"/>' }
      ],
      html: '<span class="hl">Follow</span> for patterns you missed'
    },
    {
      label: 'Follow for pattern decoding',
      icon: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/><path d="M8.5 11h5"/>',
      chips: [
        { text: 'Decode', icon: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>' },
        { text: 'Signals', icon: '<path d="M4 12h4"/><path d="M14 12h6"/>' }
      ],
      html: '<span class="hl">Follow</span> for pattern decoding'
    },

  const cta = document.getElementById('cta');
  const ico = document.getElementById('ico');
  const txt = document.getElementById('txt');
  const chips = document.getElementById('chips');
  const sel = document.getElementById('sel');

  function renderChips(items) {
    chips.innerHTML = items.map(item => `
      <span class="chip">
        <svg viewBox="0 0 24 24">${item.icon}</svg>
        ${item.text}
      </span>
    `).join('');
  }

  function pick(i) {
    const v = variants[i];
    ico.innerHTML = `<svg viewBox="0 0 24 24">${v.icon}</svg>`;
    txt.innerHTML = v.html;
    renderChips(v.chips || []);
    sel.querySelectorAll('.sel-btn').forEach((b, idx) => b.classList.toggle('on', idx === i));
    cta.style.animation = 'none';
    cta.offsetHeight;
    cta.style.animation = '';
  }

  variants.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'sel-btn' + (i === 0 ? ' on' : '');
    btn.innerHTML = `<svg viewBox="0 0 24 24">${v.icon}</svg>${v.label}`;
    btn.addEventListener('click', () => pick(i));
    sel.appendChild(btn);
  });

  pick(0);
